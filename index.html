  /* Semantic Status Colors (Clean Minimalist Pastel) */
  --ok-bg: #f0fdf4; --ok-fg: #15803d; --ok-line: #bbf7d0;
  --warn-bg: #fefce8; --warn-fg: #a16207; --warn-line: #fef08a;
  --risk-bg: #fef2f2; --risk-fg: #b91c1c; --risk-line: #fecaca;
  --info-bg: #f0f9ff; --info-fg: #0369a1; --info-line: #bae6fd;
  --off-bg: #334155; --off-fg: #f8fafc; --empty-bg: #fafbfc;

  /* Consistent Soft Shadows */
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 4px 14px rgba(15, 23, 42, 0.03);
  --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.07);
  --shadow-lg: 0 20px 45px -10px rgba(15, 23, 42, 0.16), 0 0 1px 1px rgba(15, 23, 42, 0.05);

  /* Technician Slot Colors */
  --s1: #2563eb; --s2: #ea580c; --s3: #059669; --s4: #7c3aed;
  --s5: #d97706; --s6: #0284c7; --s7: #db2777; --s8: #475569;
}

html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; padding: 0 0 60px;
  font-family: var(--font); font-size: 13.5px; line-height: 1.5;
  background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
h1, h2, h3, h4 { color: var(--ink); margin: 0; font-weight: 700; letter-spacing: -0.015em; }
h2 { font-size: 17px; margin-bottom: 10px; }
h3 { font-size: 14.5px; margin: 16px 0 8px; }
main { width: min(100%, 1920px); margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
section { margin-block: 16px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.bad { color: var(--risk-fg); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
code { font-family: var(--mono); font-size: 12px; }

/* Sticky Top Bar */
.top {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 10px rgba(15, 23, 42, 0.03);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding-bottom: 8px; }
.brand { font-size: 17px; font-weight: 800; color: #0f172a; letter-spacing: -0.02em; display: flex; align-items: center; gap: 9px; user-select: none; }
.brand-icon {
  width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
  box-shadow: 0 1px 4px rgba(15, 23, 42, 0.14); border: 2px solid #ffffff; outline: 1px solid #cbd5e1;
  flex-shrink: 0; transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.brand:hover .brand-icon { transform: scale(1.12) rotate(6deg); }
.brand small { font-size: 11px; font-weight: 500; color: var(--muted); }
.grow { flex: 1 1 auto; }
.bar-sep { color: #cbd5e1; font-size: 15px; font-weight: 300; margin: 0 2px; user-select: none; }

/* ===== Universal Button System with Unified Hover Elevation ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 7px 14px; border-radius: 9px;
  font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1;
  border: 1px solid var(--line); background: #ffffff; color: var(--ink-light);
  box-shadow: var(--shadow-sm); cursor: pointer; text-decoration: none;
  white-space: nowrap; user-select: none;
  transition: all 0.16s cubic-bezier(0.4, 0, 0.2, 1);
}
.btn:hover:not(:disabled) {
  background: #f8fafc; border-color: #cbd5e1; color: #0f172a;
  transform: translateY(-1px);
  box-shadow: 0 3px 8px rgba(15, 23, 42, 0.07);
}
.btn:active:not(:disabled) {
  transform: translateY(0); box-shadow: var(--shadow-sm);
}
.btn:disabled {
  opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important;
}

/* Primary Button (Dark Slate Accent) */
.btn.primary {
  background: #0f172a !important; color: #ffffff !important; border-color: #0f172a !important;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18) !important;
}
.btn.primary:hover:not(:disabled) {
  background: #1e293b !important; border-color: #1e293b !important;
  transform: translateY(-1px) !important; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.24) !important;
}

/* Danger Button */
.btn.danger {
  background: #fef2f2 !important; color: #dc2626 !important; border-color: #fecaca !important;
}
.btn.danger:hover:not(:disabled) {
  background: #fee2e2 !important; color: #b91c1c !important; border-color: #fca5a5 !important;
  transform: translateY(-1px) !important; box-shadow: 0 3px 8px rgba(220, 38, 38, 0.12) !important;
}

/* Button Sizes */
.btn.small { padding: 4px 10px; min-height: 28px; font-size: 12px; }
.btn.tiny { min-height: 24px; padding: 3px 8px; font-size: 11.5px; font-weight: 500; border-radius: 6px; }

/* ===== Distinct Pastel Action Bar Buttons with Harmonic Hover ===== */
/* ① Upload Planned File Button (Subtle Warm Pastel Amber) */
#btnUploadPlan.btn-upload-plan, .btn-upload-plan {
  background: #fefce8 !important; color: #92400e !important;
  border: 1px solid #fef08a !important; box-shadow: 0 1px 2px rgba(161, 98, 7, 0.04) !important;
}
#btnUploadPlan.btn-upload-plan:hover:not(:disabled), .btn-upload-plan:hover:not(:disabled) {
  background: #fef9c3 !important; color: #78350f !important; border-color: #fde047 !important;
  transform: translateY(-1px) !important; box-shadow: 0 3px 10px rgba(161, 98, 7, 0.12) !important;
}

/* ② Upload New Raw Button (Subtle Fresh Pastel Cyan/Teal) */
#btnUpload.btn-upload-raw, #btnUpload {
  background: #f0fdfa !important; color: #0f766e !important;
  border: 1px solid #99f6e4 !important; box-shadow: 0 1px 2px rgba(15, 118, 110, 0.04) !important;
}
#btnUpload.btn-upload-raw:hover:not(:disabled), #btnUpload:hover:not(:disabled) {
  background: #ccfbf1 !important; color: #115e59 !important; border-color: #5eead4 !important;
  transform: translateY(-1px) !important; box-shadow: 0 3px 10px rgba(15, 118, 110, 0.14) !important;
}

/* Export Excel Button (Subtle Fresh Pastel Green) */
#btnExport.btn-export-excel {
  margin-left: auto !important; background: #f0fdf4 !important; color: #15803d !important;
  border: 1px solid #bbf7d0 !important; box-shadow: 0 1px 2px rgba(21, 128, 61, 0.04) !important;
}
#btnExport.btn-export-excel:hover:not(:disabled) {
  background: #dcfce7 !important; color: #166534 !important; border-color: #86efac !important;
  transform: translateY(-1px) !important; box-shadow: 0 3px 10px rgba(21, 128, 61, 0.14) !important;
}

/* Clear Day Plan Button Hover */
#btnClearDayPlan:hover:not(:disabled) {
  background: #fff1f2 !important; color: #e11d48 !important; border-color: #fecdd3 !important;
  transform: translateY(-1px) !important; box-shadow: 0 3px 8px rgba(225, 29, 72, 0.08) !important;
}

/* ===== Unified Navigation Tabs with Coordinated Hover ===== */
.tabs {
  display: flex !important; flex-wrap: wrap !important; gap: 8px !important;
  padding: 6px 0 10px !important; border-bottom: 1px solid var(--line) !important;
}
.tabs button {
  border-radius: 9px !important; border: 1px solid var(--line) !important;
  background: #ffffff !important; color: var(--muted) !important;
  padding: 8px 16px !important; font-size: 13.5px !important; font-weight: 500 !important;
  cursor: pointer !important; box-shadow: var(--shadow-sm) !important;
  transition: all 0.16s cubic-bezier(0.4, 0, 0.2, 1) !important;
  white-space: nowrap !important;
}
.tabs button:hover:not(.on) {
  background: #f8fafc !important; border-color: #cbd5e1 !important; color: var(--ink) !important;
  transform: translateY(-1px) !important; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06) !important;
}
.tabs button.on {
  background: #0f172a !important; border-color: #0f172a !important; color: #ffffff !important;
  font-weight: 600 !important; transform: translateY(-1px) !important;
  box-shadow: 0 3px 10px rgba(15, 23, 42, 0.2) !important;
}

/* Reset Tab (Subtle Pastel Red with Harmonized Lift) */
.tabs button.tab-reset {
  background: #fef2f2 !important; color: #dc2626 !important; border: 1px solid #fecaca !important;
  font-weight: 500 !important;
}
.tabs button.tab-reset:hover:not(.on) {
  background: #fee2e2 !important; color: #b91c1c !important; border-color: #fca5a5 !important;
  transform: translateY(-1px) !important; box-shadow: 0 2px 6px rgba(220, 38, 38, 0.1) !important;
}
.tabs button.tab-reset.on {
  background: #dc2626 !important; color: #ffffff !important; border-color: #dc2626 !important;
  font-weight: 700 !important; transform: translateY(-1px) !important;
  box-shadow: 0 3px 10px rgba(220, 38, 38, 0.22) !important;
}

/* ===== Online Active Users Badge (วางต่อจาก ลบข้อมูลทั้งหมด ชิดขวาสุดของหน้าจอ) ===== */
.online-users-badge {
  margin-left: auto !important;
  display: inline-flex !important;
  align-items: center !important;
  gap: 6px !important;
  padding: 5px 11px !important;
  border-radius: 99px !important;
  background: #ffffff !important;
  border: 1px solid var(--line) !important;
  box-shadow: var(--shadow-sm) !important;
  color: #0f172a !important;
  font-size: 13px !important;
  font-weight: 500 !important;
  user-select: none !important;
  white-space: nowrap !important;
  transition: all 0.16s cubic-bezier(0.4, 0, 0.2, 1) !important;
}
.online-users-badge:hover {
  background: #f8fafc !important;
  border-color: #cbd5e1 !important;
  transform: translateY(-1px) !important;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06) !important;
}
.online-dot {
  width: 8px !important;
  height: 8px !important;
  border-radius: 50% !important;
  background: #22c55e !important;
  display: inline-block !important;
  box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7) !important;
  animation: pulseDot 2s infinite cubic-bezier(0.45, 0, 0.55, 1) !important;
}
@keyframes pulseDot {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}
.online-icon {
  display: inline-flex !important;
  align-items: center !important;
  color: #059669 !important;
  font-size: 14px !important;
}
.online-num {
  font-weight: 700 !important;
  color: #0f172a !important;
  font-variant-numeric: tabular-nums !important;
  font-size: 13.5px !important;
}

/* ===== Technician Table Actions (Modern Micro-Buttons) ===== */
.tech-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
.tech-actions .btn.tiny {
  padding: 3px 8px !important; font-size: 11.5px !important; border-radius: 6px !important;
  white-space: nowrap !important; font-weight: 500 !important; border: 1px solid var(--line) !important;
  background: #ffffff !important; color: var(--muted) !important;
}
.tech-actions .btn.tiny:hover {
  background: #f8fafc !important; border-color: #cbd5e1 !important; color: var(--ink) !important;
  transform: translateY(-1px) !important; box-shadow: 0 2px 5px rgba(15, 23, 42, 0.06) !important;
}
.tech-actions button[data-act="techLock"].on {
  background: #a3f3bf !important; color: #064e3b !important; border-color: #86efac !important; font-weight: 600 !important;
}
.tech-actions button[data-act="techLock"].on:hover {
  background: #8cf0ac !important; color: #064e3b !important; border-color: #4ade80 !important;
  transform: translateY(-1px) !important; box-shadow: 0 2px 6px rgba(16, 185, 129, 0.2) !important;
}
.tech-actions button[data-act="dayoff"].on {
  background: #f0fdf4 !important; color: #166534 !important; border-color: #86efac !important; font-weight: 600 !important;
}
.tech-actions button[data-act="dayoff"].on:hover {
  background: #dcfce7 !important; border-color: #4ade80 !important;
}
.tech-actions button[data-act="clearTech"]:hover {
  background: #fff1f2 !important; color: #b91c1c !important; border-color: #fecdd3 !important;
}
.tech-actions a {
  background: #eff6ff !important; color: #2563eb !important; border-color: #bfdbfe !important;
  text-decoration: none; display: inline-flex; align-items: center;
}
.tech-actions a:hover {
  background: #dbeafe !important; color: #1d4ed8 !important; border-color: #93c5fd !important;
  transform: translateY(-1px) !important;
}

/* Locked Technician Row & Chips */
tr.lockedrow { background: #f7fbf8 !important; }
tr.lockedrow:hover { background: #eef7f1 !important; }
tr.lockedrow th.c-name { background: #eef7f1 !important; border-right-color: #cdecdb !important; }
tr.lockedrow td.slot { background: #f7fbf8 !important; border-right-color: #e5f5ec !important; }
tr.lockedrow td.slot:hover { background: #eef7f1 !important; }
tr.lockedrow td.zone, tr.lockedrow td.num { background: #f7fbf8 !important; }
.lock-tag { display: inline-block; padding: 1px 6px; border-radius: 6px; background: #065f46; color: #ecfdf5; font-size: 10.5px; font-weight: 700; margin-left: 4px; }
.chip.chip-locked {
  background: #334155 !important; border: 1px solid #1e293b !important; color: #f8fafc !important;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.2) !important; cursor: not-allowed !important;
}
.chip.chip-locked .ct { color: #ffffff !important; font-weight: 600; }
.chip.chip-locked .tag { background: rgba(15, 23, 42, 0.45) !important; color: #f1f5f9 !important; border-color: rgba(255, 255, 255, 0.25) !important; }
.chip.chip-locked .tag-locked { background: #0f172a !important; color: #fef08a !important; font-weight: 700 !important; border: 1px solid #ca8a04 !important; }
.slot-locked-ind {
  display: flex; align-items: center; justify-content: center; min-height: 50px;
  border: 1px dashed #cbd5e1; border-radius: 8px; color: #64748b; font-size: 11.5px; font-weight: 600;
  background: rgba(255, 255, 255, 0.6);
}

/* ===== Minimalist Modern Modals & Dialog Windows (ทุกหน้าต่าง) ===== */
#modal {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) 16px 24px;
  overflow-y: auto;
}
#modal[hidden] { display: none; }
.mbox {
  background: #ffffff; border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow-lg); width: min(600px, 100%);
  padding: 24px; position: relative; margin-block: auto;
  animation: modalIn .18s cubic-bezier(0.16, 1, 0.3, 1);
}
.mbox.wide { width: min(1040px, 100%); }
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.97) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.mbox h2 {
  font-size: 18px; font-weight: 700; color: #0f172a; margin: 0 0 16px;
  padding-bottom: 12px; border-bottom: 1px solid var(--line-light); letter-spacing: -0.015em;
}
.mbox .x {
  position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
  border: 1px solid var(--line); border-radius: 8px; background: #ffffff;
  color: var(--muted); font-size: 15px; display: grid; place-items: center;
  cursor: pointer; transition: all .14s ease;
}
.mbox .x:hover {
  background: #f1f5f9; color: var(--ink); border-color: #cbd5e1; transform: scale(1.05);
}
.mbody {
  max-height: 72vh; overflow-y: auto; padding-right: 4px;
  font-size: 13.5px; line-height: 1.6; color: var(--ink-light);
}
.mfoot {
  margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line-light);
  display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap;
}

/* Modal Form Fields & Elements */
.map { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-block: 10px; }
.map label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--ink-light); }
.radios { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-block: 8px; }
.radios label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 12px 0; font-size: 13px; }
dt { font-weight: 600; color: var(--muted); }
dd { margin: 0; color: var(--ink); word-break: break-word; }
ul.log { list-style: none; padding: 0; margin: 10px 0; display: flex; flex-direction: column; gap: 6px; }
ul.log li {
  padding: 8px 12px; background: #f8fafc; border: 1px solid var(--line);
  border-radius: 9px; font-size: 12.5px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  transition: background .14s;
}
ul.log li:hover { background: #f1f5f9; }
.pickrow {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px;
  background: #ffffff; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px;
  transition: all .16s cubic-bezier(0.4, 0, 0.2, 1);
}
.pickrow:hover {
  background: #f8fafc; border-color: #cbd5e1; transform: translateY(-1px);
  box-shadow: 0 3px 8px rgba(15, 23, 42, 0.05);
}
.row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-block: 10px; }
.row label { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }

/* Clean Minimalist Data Tables inside Modals */
table.data {
  border-collapse: separate; border-spacing: 0; border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; width: 100%; font-size: 12.5px; background: #ffffff;
}
table.data thead th {
  background: #f8fafc; color: #475569; font-weight: 700; font-size: 12px;
  padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left;
}
table.data tbody td {
  padding: 9px 12px; border-bottom: 1px solid var(--line-light); color: var(--ink-light); vertical-align: middle;
}
table.data tbody tr:last-child td { border-bottom: none; }
table.data tbody tr:hover { background: #f8fafc; }

/* ===== Forms, Inputs, Dropdowns ===== */
input, select, textarea {
  font-family: inherit; font-size: 13.5px; border: 1px solid #cbd5e1;
  border-radius: 9px; padding: 7px 11px; background: #ffffff; color: var(--ink);
  min-height: 36px; transition: border-color .15s, box-shadow .15s, background-color .15s;
}
input:focus, select:focus, textarea:focus {
  border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12); outline: none;
}
input:hover:not(:focus), select:hover:not(:focus), textarea:hover:not(:focus) {
  border-color: #94a3b8;
}
#q { width: 280px; max-width: 100%; }

/* ===== Summary Cards & Statistics ===== */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 10px; margin-block: 10px; }
.stat {
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  background: #ffffff; box-shadow: var(--shadow-sm); display: flex; flex-direction: column;
  gap: 3px; position: relative; overflow: hidden;
}
.stat:before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #94a3b8; }
.stat.ok:before { background: #22c55e; }
.stat.warn:before { background: #eab308; }
.stat.risk:before { background: #ef4444; }
.stat.info:before { background: #3b82f6; }
.stat .n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; letter-spacing: -0.02em; }
.stat .l { font-size: 12px; font-weight: 500; color: var(--muted); }
.summary.small .stat { padding: 8px 10px; border-radius: 9px; }
.summary.small .stat .n { font-size: 16px; }

/* Status Pills */
.pill {
  display: inline-flex; gap: 4px; align-items: center; border-radius: 99px;
  padding: 3px 10px; font-size: 11.5px; font-weight: 600; border: 1px solid; white-space: nowrap;
}
.pill i { font-style: normal; }
.pill.ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-line); }
.pill.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }
.pill.risk { background: var(--risk-bg); color: var(--risk-fg); border-color: var(--risk-line); }
.pill.info { background: var(--info-bg); color: var(--info-fg); border-color: var(--info-line); }
.pill.off { background: var(--panel-alt); color: var(--muted); border-color: var(--line); }

/* Banners */
.banner {
  border: 1px solid; border-radius: 11px; padding: 10px 14px; margin-block: 8px; font-size: 13px; line-height: 1.5;
}
.banner.ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-line); }
.banner.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }
.banner.risk { background: var(--risk-bg); color: var(--risk-fg); border-color: var(--risk-line); }
.banner.info { background: var(--info-bg); color: var(--info-fg); border-color: var(--info-line); }

/* ===== Plan Table & Job Chips ===== */
.plan-wrap {
  background: #ffffff; border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; box-shadow: var(--shadow); margin-top: 14px;
}
.plan-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.tscroll { border: 1px solid var(--line); border-radius: 11px; overflow: auto; background: #ffffff; }
table.plan { min-width: 1390px; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
table.plan th, table.plan td { border: 0; border-right: 1px solid #eef2f6; border-bottom: 1px solid #eef2f6; padding: 8px; vertical-align: top; }
table.plan thead th {
  background: #f8fafc; color: #475569; font-size: 12px; font-weight: 700;
  padding: 11px 9px; position: sticky; top: 0; z-index: 2; border-bottom: 1px solid var(--line);
}
table.plan thead th:first-child { left: 0; z-index: 4; }
table.plan tbody tr:nth-child(even) { background: #fafbfc; }
table.plan tbody tr:hover { background: #f8fafc; }
th.c-name {
  width: 205px; min-width: 205px; background: #f8fafc !important;
  position: sticky; left: 0; z-index: 1; box-shadow: 3px 0 7px rgba(15, 23, 42, 0.03);
}
table.plan tbody th.c-name { padding: 12px 10px; }
.tn { font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
td.slot { width: 180px; min-width: 180px; height: 92px; background: #fafbfc; transition: background .15s; }
td.slot:hover { background: #f1f5f9; }
td.slot.off { background: #334155; color: #ffffff; text-align: center; vertical-align: middle; }
td.slot.over { outline: 3px dashed #6366f1; outline-offset: -4px; background: #eef2ff; }

/* Job Chips */
.chip {
  display: flex; gap: 5px; border: 1px solid; border-radius: 8px; padding: 6px 8px;
  margin-bottom: 5px; cursor: grab; font-size: 11.5px; line-height: 1.4;
  align-items: flex-start; flex-wrap: wrap; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
  transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
.chip:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(15, 23, 42, 0.08); }
.chip .ct { font-family: var(--mono); font-size: 11.5px; font-weight: 600; flex: 1 1 100px; }
.chip i { font-style: normal; font-weight: 700; }
.chip.lv-ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-line); }
.chip.lv-warn { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }
.chip.lv-risk { background: var(--risk-bg); color: var(--risk-fg); border-color: var(--risk-line); }
.chip .tag { border-radius: 99px; padding: 1px 6px; font-size: 10px; background: rgba(255, 255, 255, 0.65); border: 1px solid currentColor; }
.chip .cl { display: inline-block; border-radius: 3px; cursor: pointer; }
.chip .cl:hover { text-decoration: underline; }
.chip .dist { flex-basis: 100%; font-size: 10.5px; opacity: 0.85; }
.chip.new-upload { border: 2px solid #2563eb !important; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.16); background: #eff6ff !important; }
.new-upload-tag { display: inline-block; margin-top: 4px; padding: 2px 7px; border: 1px solid #3b82f6; border-radius: 999px; background: #dbeafe; color: #1d4ed8; font-size: 10px; font-weight: 700; }

.addbtn {
  min-height: 56px; border: 1px dashed #cbd5e1; border-radius: 8px;
  background: #ffffff; color: var(--muted); opacity: 0.7; cursor: pointer;
  transition: all .14s ease; width: 100%;
}
.addbtn:hover, .addbtn:focus-visible {
  background: #f1f5f9; border-color: #6366f1; color: var(--ink); opacity: 1; transform: translateY(-1px);
}
.ghost {
  display: block; width: 100%; margin-bottom: 4px; border: 1px dashed var(--muted);
  background: transparent; color: inherit; font-size: 11px; padding: 4px 6px;
  border-radius: 6px; cursor: pointer; text-align: left; transition: all .14s ease;
}
.ghost:hover { background: #f8fafc; border-color: var(--ink); }

/* Unassigned / Review Panel Cards */
.lpanel { background: #ffffff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.ucard {
  border: 1px solid var(--line); border-left: 4px solid #cbd5e1; border-radius: 10px;
  padding: 10px 12px; margin-block: 8px; background: #ffffff; cursor: grab;
  box-shadow: var(--shadow-sm); transition: all .16s ease;
}
.ucard:hover {
  transform: translateY(-1px); border-color: #94a3b8; box-shadow: var(--shadow-md);
}
.ucard.risk { border-left-color: #ef4444; }
.ucard.warn { border-left-color: #eab308; }
.ucard.removed { border-left-color: #94a3b8; border-left-style: dashed; }
.cnt { background: #f1f5f9; color: #0f172a; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; margin-left: 4px; }

/* ===== Toast Notifications ===== */
#toast {
  position: fixed; left: 0; right: 0; bottom: 20px; z-index: 2100;
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
}
.toast {
  pointer-events: auto; background: #0f172a; color: #f8fafc; border-radius: 10px;
  padding: 9px 16px; font-size: 13px; font-weight: 500;
  box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.25);
  animation: toastIn .2s cubic-bezier(0.16, 1, 0.3, 1);
}
.toast.ok { background: #15803d; color: #ffffff; }
.toast.err { background: #b91c1c; color: #ffffff; }
.toast.warn { background: #a16207; color: #ffffff; }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(10px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ===== Settings & Master Data Modern Cards ===== */
.settings-wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.settings-hero {
  background: #ffffff; border: 1px solid var(--line); border-radius: 16px;
  padding: 20px 24px; box-shadow: var(--shadow); display: flex; justify-content: space-between;
  align-items: center; flex-wrap: wrap; gap: 12px;
}
.settings-hero h2 { font-size: 20px; font-weight: 700; color: #0f172a; }
.settings-hero p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.settings-card {
  background: #ffffff; border: 1px solid var(--line); border-radius: 16px;
  padding: 20px 24px; box-shadow: var(--shadow-sm);
  transition: box-shadow .18s ease, border-color .18s ease;
}
.settings-card:hover { border-color: #cbd5e1; box-shadow: var(--shadow-md); }
.settings-card-head {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
  gap: 12px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line-light);
}
.settings-card-title { display: flex; align-items: center; gap: 12px; }
.settings-icon-badge {
  width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-size: 18px; flex-shrink: 0; background: #f1f5f9; color: #0f172a;
}
.settings-icon-badge.purple { background: #f5f3ff; color: #6366f1; }
.settings-icon-badge.blue { background: #eff6ff; color: #2563eb; }
.settings-icon-badge.green { background: #f0fdf4; color: #16a34a; }
.settings-icon-badge.amber { background: #fefce8; color: #d97706; }
.settings-icon-badge.rose { background: #fff1f2; color: #e11d48; }
.settings-card-title h3 { margin: 0; font-size: 16.5px; font-weight: 700; color: #0f172a; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-block: 8px; }
.settings-field {
  display: flex; flex-direction: column; gap: 5px; background: #f8fafc; border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; transition: border-color .15s, background-color .15s;
}
.settings-field:focus-within { background: #ffffff; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
.settings-field label { font-size: 12.5px; font-weight: 600; color: var(--ink); display: flex; justify-content: space-between; }
.settings-field .field-hint { font-size: 11px; color: var(--muted); font-weight: 400; }
.settings-toggle-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #f8fafc;
  border: 1px solid var(--line); border-radius: 12px; margin-block: 8px; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.settings-toggle-row:hover { background: #f1f5f9; border-color: #cbd5e1; }
.settings-toggle-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
.settings-toggle-row b { font-size: 14px; font-weight: 600; color: #0f172a; }
.settings-toggle-row p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

/* Chiplist */
.chiplist { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 8px 0; }
.chiplist li {
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
  background: #ffffff; font-size: 12px; display: inline-flex; align-items: center; gap: 6px;
}

/* Reset Page */
.reset-page {
  max-width: 640px; margin: 30px auto; padding: 28px; background: #ffffff;
  border: 1px solid #fecaca; border-radius: 18px; box-shadow: var(--shadow); text-align: center;
}
.reset-icon {
  width: 50px; height: 50px; display: grid; place-items: center; margin: 0 auto 12px;
  border-radius: 14px; background: #fef2f2; color: #dc2626; font-size: 24px;
}
.reset-page h2 { color: #991b1b; }
.reset-actions { display: flex; justify-content: center; gap: 12px; margin-top: 18px; }

/* Real Map styling */
.real-map-wrapper {
  position: relative; z-index: 1; isolation: isolate; width: 100%; height: 600px; border-radius: 14px; overflow: hidden;
  border: 1px solid var(--line); box-shadow: var(--shadow); background: #f8fafc; margin-bottom: 16px;
}
.real-map-container { width: 100%; height: 100%; }
.real-map-loading {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.75); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 500; font-size: 14px; z-index: 1000;
}
.real-map-toolbar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  margin: 12px 0 10px; padding: 10px 14px; background: #ffffff; border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow-sm);
}
.quick-district { margin: 6px 0; display: flex; align-items: center; gap: 6px; background: var(--panel); padding: 4px 8px; border-radius: 8px; border: 1px solid #cbd5e1; }

@media (max-width: 640px) {
  body { font-size: 13px; }
  .top { padding-top: 8px; }
  .bar { gap: 6px; }
  .bar .btn { font-size: 12px; padding: 6px 10px; }
  .tabs button { padding: 7px 12px; font-size: 12px; }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  th.c-name { width: 180px; min-width: 180px; }
  td.slot { width: 160px; min-width: 160px; }
}
</style>

function parseCSV(text) {

  cands.forEach(d => { const c = first.split(d).length; if (c > best) { best = c; delim = d; } });
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }

function districtFromCoord(lat, lon) {
  if (lat == null || lon == null || isNaN(lat) || isNaN(lon) || (lat === 0 && lon === 0)) return null;
  let best = null, minDist = Infinity;
  Object.values(DISTRICTS).forEach(d => {
    if (d.lat && d.lon) {
      const dist = haversine({ lat, lon }, { lat: d.lat, lon: d.lon });
      if (dist < minDist) {
        minDist = dist;
        best = d;
      }
    }
  });
  if (best && minDist <= 25) {
    return { name: best.name, prov: best.prov, how: 'ระบุจากพิกัดดาวเทียม (~' + minDist.toFixed(1) + ' กม. จากศูนย์กลางเขต)' };
  }
  return null;
}

function parseDistrict(addr, aliases, coord, access) {
  const a = String(addr || '').replace(/\([^)]*\)/g, ' ').replace(/[ ​]/g, ' ').replace(/\s+/g, ' ').trim();
  const found = (d, how) => ({ name: d.name, prov: d.prov, how });
  if (!a && (!coord || coord.lat == null)) return { name: null, how: 'ไม่มีที่อยู่' };
  
  // 1. User defined aliases
  for (const al of (aliases || [])) {
    if (al.alias && a.includes(al.alias)) return { name: al.district, how: 'ชื่อเรียกที่ผู้ใช้กำหนด' };
  }

  // 2. Explicit 'เขต...' in address
  let m = /(?:^|\s)เขต\s*([฀-๿]+)/.exec(a);
  if (m) {
    const rawName = m[1].trim();
    const d = DISTRICTS[rawName];
    if (d && d.prov === BKK) return found(d, 'ระบุ "เขต" ในที่อยู่');
  }

  // 3. Explicit 'อำเภอ...' / 'อ....' in address
  m = /(?:^|\s)(?:อำเภอ|อ\.)\s*([฀-๿]+)/.exec(a);
  if (m) {
    let n = m[1].trim();
    let provMatch = /(?:^|\s)(?:จ\.|จังหวัด)\s*([฀-๿]+)/.exec(a);
    let pName = provMatch ? normProv(provMatch[1]) : null;
    if (n === 'เมือง' && pName) n = 'เมือง' + pName;
    const d = DISTRICTS[n];
    if (d) return found(d, 'ระบุ "อำเภอ" ในที่อยู่');
    if (pName && !DICT_PROVS.has(pName)) return { name: n, prov: pName, how: 'ระบุ "อำเภอ" (ไม่มีค่าอ้างอิงตำแหน่ง)', noRef: true };
  }

  // 4. Check subdistricts (แขวง / ตำบล)
  for (const [sub, distName] of Object.entries(SUBDISTRICT_MAP)) {
    if (a.includes(sub)) {
      const d = DISTRICTS[distName];
      if (d) return found(d, 'ตรงกับแขวง/ตำบล "' + sub + '"');
    }
  }

  // 5. Province parsing & word before province
  let prov = null;
  m = /(?:^|\s)(?:จ\.|จังหวัด)\s*([฀-๿]+)/.exec(a);
  if (m) prov = normProv(m[1]);
  const toks = a.split(' ').filter(Boolean);
  let t = toks.slice();
  if (t.length && /^\d{5}$/.test(t[t.length - 1])) t.pop();
  if (!prov && t.length) prov = normProv(t[t.length - 1]);

  if (prov) {
    let idx = -1;
    t.forEach((x, i) => { if (normProv(x) === prov) idx = i; });
    if (idx > 0) {
      let c = t[idx - 1];
      if (!/^(ต\.|ตำบล|แขวง|ซ\.|ถ\.)/.test(c)) {
        c = c.replace(/^(อ\.|อำเภอ|เขต)/, '');
        if (c === 'เมือง') c = 'เมือง' + prov;
        const d = DISTRICTS[c];
        if (d && d.prov === prov) return found(d, 'คำก่อนจังหวัด');
      }
    }
  }

  // 6. Direct match of known district name in string (sorted by longest name first)
  const sortedDistricts = Object.values(DISTRICTS).slice().sort((x, y) => y.name.length - x.name.length);
  for (const d of sortedDistricts) {
    if (a.includes(d.name)) {
      return found(d, 'พบชื่อเขต/อำเภอในที่อยู่');
    }
  }

  // 7. English address matching
  const words = a.toLowerCase().match(/[a-z]+/g) || [];
  {
    const flatEn = a.toLowerCase().replace(/[^a-z]/g, '');
    const enProvs = [
      ['bangkok', BKK], ['krungthep', BKK],
      ['samutprakan', 'สมุทรปราการ'], ['samutprakarn', 'สมุทรปราการ'],
      ['pathumthani', 'ปทุมธานี'],
      ['nonthaburi', 'นนทบุรี']
    ];
    let ep = null;
    for (const [en, th] of enProvs) {
      const key = en.replace(/[^a-z]/g, '');
      if (key && flatEn.endsWith(key) && (!ep || key.length > ep.key.length)) ep = { key, th };
    }
    if (ep) {
      const beforeProv = flatEn.slice(0, -ep.key.length);
      const candidates = Object.values(DISTRICTS)
        .filter(d => d.prov === ep.th)
        .map(d => ({ d, names: d.en.map(x => x.toLowerCase().replace(/[^a-z]/g, '')).filter(Boolean) }))
        .flatMap(x => x.names.filter(n => beforeProv.endsWith(n)).map(n => ({ d: x.d, n })))
        .sort((x, y) => y.n.length - x.n.length);
      if (candidates.length) return found(candidates[0].d, 'ชื่อเขตภาษาอังกฤษติดกับจังหวัด');
    }
  }
  for (let i = 0; i < words.length; i++) {
    if (/^(khet|khate|amphoe|amphur|district|dist|mueang|muang)$/.test(words[i])) {
      const from = /^(mueang|muang)$/.test(words[i]) ? i : i + 1;
      for (let k = 1; k <= 4; k++) {
        const key = words.slice(from, from + k).join('');
        if (EN_INDEX[key]) return found(DISTRICTS[EN_INDEX[key]], 'ชื่อภาษาอังกฤษ (Khet/Amphoe)');
      }
    }
  }
  {
    const EP = [['bangkok', BKK], ['krungthep', BKK], ['samutprakan', 'สมุทรปราการ'], ['pathumthani', 'ปทุมธานี'], ['nonthaburi', 'นนทบุรี']];
    let hit = null;
    for (let i = 0; i < words.length; i++) for (const [en, th] of EP) {
      const n = en === 'samutprakan' || en === 'pathumthani' || en === 'krungthep' ? 2 : 1;
      if (words.slice(i, i + n).join('') === en) hit = { at: i, n, th };
    }
    if (hit) {
      const before = words.slice(0, hit.at);
      const wholeProv = { 'สมุทรปราการ': 'samutprakan', 'ปทุมธานี': 'pathumthani', 'นนทบุรี': 'nonthaburi' }[hit.th];
      if (wholeProv && before.length >= hit.n && before.slice(-hit.n).join('') === wholeProv && DISTRICTS['เมือง' + hit.th]) return found(DISTRICTS['เมือง' + hit.th], 'ชื่อภาษาอังกฤษก่อนจังหวัด (เมือง' + hit.th + ')');
      for (let k = Math.min(3, before.length); k >= 1; k--) {
        const key = before.slice(before.length - k).join('');
        const th = EN_INDEX[key];
        if (th && DISTRICTS[th].prov === hit.th) return found(DISTRICTS[th], 'ชื่อภาษาอังกฤษก่อนจังหวัด');
      }
    }
  }

  // 8. Postal code 5 digits match
  const zipMatch = a.match(/(?:^|\D)(\d{5})(?:\D|$)/);
  if (zipMatch && ZIP_DISTRICT_MAP[zipMatch[1]]) {
    const dName = ZIP_DISTRICT_MAP[zipMatch[1]];
    if (DISTRICTS[dName]) return found(DISTRICTS[dName], 'ระบุจากรหัสไปรษณีย์ ' + zipMatch[1]);
  }

  // 9. Coordinate-based fallback (lat/lon)
  if (coord && coord.lat != null && coord.lon != null) {
    const fromCoord = districtFromCoord(coord.lat, coord.lon);
    if (fromCoord) return fromCoord;
  }

  // 10. String ending with district before province
  if (prov) {
    const names = prov === BKK ? ['กรุงเทพมหานคร', 'กรุงเทพฯ', 'กรุงเทพ', 'กทม'] : [prov];
    let at = -1; names.forEach(n => { const k = a.lastIndexOf(n); if (k > at) at = k; });
    if (at > 0) {
      const before = a.slice(0, at).replace(/[\s.,]+$/, '');
      const c = Object.values(DISTRICTS).filter(d => d.prov === prov && before.endsWith(d.name)).sort((x, y) => y.name.length - x.name.length)[0];
      if (c) return found(c, 'ชื่อติดกับจังหวัด');
    }
  }

    const roadKm = cached.roadKm;
    const roadMin = cached.roadMin;
    const need = S.settings.workMin + roadMin;
    const hasRealRoad = Boolean((cached.polyline && cached.polyline.length > 5 && cached.source !== "fallback_estimate") || cached.source === "osrm_table");
    return {
      d,
      roadKm,
      roadMin,
      real: hasRealRoad,
      source: cached.source || "osrm",
      polyline: cached.polyline || "",
      gap,
      tm: roadMin,
      need,
      ok: gap === 0 ? roadKm <= S.settings.doubleKm : need <= gap
    };
  }
  const need = S.settings.workMin + estTm;
  return {
    d,
    roadKm: null,
    roadMin: null,
    real: false,
    source: null,
    polyline: null,
    gap,
    tm: estTm,
    need,
    ok: gap === 0 ? d <= S.settings.doubleKm : need <= gap
  };
}

let isCalculatingRoutes = false;
let routeCalcProgress = { total: 0, done: 0 };

async function calculateRealRoutesForDate(date) {
  if (isCalculatingRoutes) return;
  const a = analyze(date);
  if (!a) { toast("ไม่มีข้อมูลแพลนในวันที่เลือก", "err"); return; }

  const pairsToFetch = [];
  const seenKeys = new Set();
  a.techs.forEach(t => {
    const L = a.perTech[t.id] ? a.perTech[t.id].list : [];
    for (let i = 1; i < L.length; i++) {
      const A = L[i - 1], B = L[i];
      if (A.u.coord && B.u.coord) {
        const k = routeKey(A.u.coord, B.u.coord);
        if (k && !seenKeys.has(k)) {
          seenKeys.add(k);
          const cached = getCachedRoute(A.u.coord, B.u.coord);
          const hasRealRoad = cached && cached.polyline && cached.polyline.length > 5 && cached.source !== "fallback_estimate";
          if (!hasRealRoad) {
            pairsToFetch.push({
              id: k,
              origin: { lat: A.u.coord.lat, lon: A.u.coord.lon },
              destination: { lat: B.u.coord.lat, lon: B.u.coord.lon }
            });
          }
        }
      }
    }
  });

  // If all pairs were already calculated with roads, re-fetch all so user can refresh routes on click
  if (!pairsToFetch.length) {
    seenKeys.clear();
    a.techs.forEach(t => {
      const L = a.perTech[t.id] ? a.perTech[t.id].list : [];
      for (let i = 1; i < L.length; i++) {
        const A = L[i - 1], B = L[i];
        if (A.u.coord && B.u.coord) {
          const k = routeKey(A.u.coord, B.u.coord);
          if (k && !seenKeys.has(k)) {
            seenKeys.add(k);
            pairsToFetch.push({
              id: k,
              origin: { lat: A.u.coord.lat, lon: A.u.coord.lon },
              destination: { lat: B.u.coord.lat, lon: B.u.coord.lon }
            });
          }
        }
      }
    });
  }

  if (!pairsToFetch.length) {
    toast("ไม่มีรายการงานที่มีพิกัดต่อเนื่องกันในวันนี้", "warn");
    return;
  }

  isCalculatingRoutes = true;
  routeCalcProgress = { total: pairsToFetch.length, done: 0 };
  render();
  toast("🚗 กำลังคำนวณเส้นทางและเวลาตามถนนจริง " + pairsToFetch.length + " ช่วง...", "info");

  S.routes = S.routes || {};
  let calculatedCount = 0;

  // 1. First attempt: Check backend /api/routes/batch (if running on local dev server)
  let backendHandled = false;
  const isStaticHost = window.location.hostname.endsWith("github.io") || window.location.protocol === "file:";
  if (!isStaticHost) {
  try {
    const res = await fetch("/api/routes/batch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pairs: pairsToFetch }),
      signal: AbortSignal.timeout(3500)
    });
    if (res.ok) {
      const data = await res.json();
      if (data && data.results && Object.keys(data.results).length) {
        let hasValidRoads = false;
        Object.keys(data.results).forEach(k => {
          const item = data.results[k];
          if (item && item.distanceMeters != null && item.polyline && item.polyline.length > 5) {
            S.routes[k] = {
              roadKm: item.distanceMeters / 1000,
              roadMin: item.durationSeconds / 60,
              distanceMeters: item.distanceMeters,
              durationSeconds: item.durationSeconds,
              polyline: item.polyline,
              source: item.source || "google_maps",
              ts: Date.now()
            };
            calculatedCount++;
            hasValidRoads = true;
          }
        });
        if (hasValidRoads) {
          backendHandled = true;
        }
      }
    }
  } catch(e) {}
  }

  // 2. If not handled by backend (e.g. running on GitHub Pages or no Google Maps key), use direct client-side OSRM routing
  if (!backendHandled) {
    const CHUNK_SIZE = 4;
    for (let i = 0; i < pairsToFetch.length; i += CHUNK_SIZE) {
      const chunk = pairsToFetch.slice(i, i + CHUNK_SIZE);
      await Promise.all(chunk.map(async (p) => {
        // Try OSRM (Open Source Routing Machine - Open CORS, worldwide road network, real driving polylines)
        try {
          const url = "https://router.project-osrm.org/route/v1/driving/" + p.origin.lon + "," + p.origin.lat + ";" + p.destination.lon + "," + p.destination.lat + "?overview=full&geometries=polyline";
          const r = await fetch(url, { signal: AbortSignal.timeout(5000) });
          if (r.ok) {
            const d = await r.json();
            if (d && d.code === "Ok" && d.routes && d.routes[0]) {
              const rt = d.routes[0];
              S.routes[p.id] = {
                roadKm: rt.distance / 1000,
                roadMin: rt.duration / 60,
                distanceMeters: Math.round(rt.distance),
                durationSeconds: Math.round(rt.duration),
                polyline: rt.geometry,
                source: "osrm",
                ts: Date.now()
              };
              calculatedCount++;
              return;
            }
          }
        } catch(err) {}

        // Smooth road-interpolated curve fallback if network temporarily fails
        const distDirect = haversine(p.origin, p.destination);
        const roadKm = distDirect * 1.35;
        const roadMin = (roadKm / 22) * 60 + 2;
        const pts = [];
        const steps = 8;
        for (let s = 0; s <= steps; s++) {
          const f = s / steps;
          const curve = Math.sin(f * Math.PI) * 0.0018;
          pts.push({
            lat: p.origin.lat + (p.destination.lat - p.origin.lat) * f + curve,
            lon: p.origin.lon + (p.destination.lon - p.origin.lon) * f - curve
          });
        }
        S.routes[p.id] = {
          roadKm,
          roadMin,
          distanceMeters: Math.round(roadKm * 1000),
          durationSeconds: Math.round(roadMin * 60),
          polyline: encodePolyline(pts),
          source: "road_interpolated",
          ts: Date.now()
        };
        calculatedCount++;
      }));
      routeCalcProgress.done = Math.min(pairsToFetch.length, i + CHUNK_SIZE);
    }
  }

  save();
  toast("✓ คำนวณเส้นทางและเวลาขับขี่จริงเรียบร้อยแล้ว (" + calculatedCount + " ช่วง) เส้นทางโค้งตามแนวถนนจริง", "ok");
  isCalculatingRoutes = false;
  render();
}

function getRealRoadMetric(origin, dest) {
  if (!origin || !dest || origin.lat == null || origin.lon == null || dest.lat == null || dest.lon == null) return null;
  const direct = haversine(origin, dest);
  const cached = getCachedRoute(origin, dest);
  if (cached && cached.roadKm != null && cached.source !== "fallback_estimate") {
    return { km: cached.roadKm, min: cached.roadMin != null ? cached.roadMin : travelMin(direct), direct, real: true };
  }
  return { km: direct, min: travelMin(direct), direct, real: false };
}

async function fetchRealRoadMatrix(pairs, onProgress) {
  if (!pairs || !pairs.length) {
    if (onProgress) onProgress(0, 0);
    return 0;
  }
  S.routes = S.routes || {};
  const missing = [];
  const seen = new Set();
  pairs.forEach(p => {
    if (!p || !p.origin || !p.destination) return;
    if (p.origin.lat == null || p.origin.lon == null || p.destination.lat == null || p.destination.lon == null) return;
    const k = routeKey(p.origin, p.destination);
    if (!k || seen.has(k)) return;
    seen.add(k);
    const cached = getCachedRoute(p.origin, p.destination);
    if (cached && cached.roadKm != null && cached.source !== "fallback_estimate") return;
    const ok = Number(p.origin.lat).toFixed(5) + "," + Number(p.origin.lon).toFixed(5);
    const dk = Number(p.destination.lat).toFixed(5) + "," + Number(p.destination.lon).toFixed(5);
    missing.push({ key: k, ok, dk, origin: p.origin, destination: p.destination });
  });
  if (!missing.length) {
    if (onProgress) onProgress(0, 0);
    return 0;
  }

  // Group into M x N bipartite matrix batches (<= 20 origins, <= 35 destinations per OSRM Table call)
  const byOrigin = new Map();
  missing.forEach(m => {
    if (!byOrigin.has(m.ok)) byOrigin.set(m.ok, { ok: m.ok, coord: m.origin, items: [] });
    byOrigin.get(m.ok).items.push(m);
  });

  const batches = [];
  const MAX_O = 20;
  const MAX_D = 35;
  let curOrigins = [];
  let curDests = new Map();
  let curItems = [];

  const flushBatch = () => {
    if (!curItems.length) return;
    batches.push({
      origins: curOrigins,
      dests: Array.from(curDests.values()),
      items: curItems
    });
    curOrigins = [];
    curDests = new Map();
    curItems = [];
  };

  const originGroups = Array.from(byOrigin.values()).sort((a, b) => b.items.length - a.items.length);
  originGroups.forEach(g => {
    if (g.items.length > MAX_D) {
      for (let i = 0; i < g.items.length; i += MAX_D) {
        const sub = g.items.slice(i, i + MAX_D);
        const dm = new Map();
        sub.forEach(m => { if (!dm.has(m.dk)) dm.set(m.dk, m.destination); });
        batches.push({ origins: [{ ok: g.ok, coord: g.coord }], dests: Array.from(dm.values()), items: sub });
      }
      return;
    }
    const needDestMap = new Map(curDests);
    g.items.forEach(m => { if (!needDestMap.has(m.dk)) needDestMap.set(m.dk, m.destination); });
    if (curOrigins.length && (curOrigins.length + 1 > MAX_O || needDestMap.size > MAX_D)) {
      flushBatch();
    }
    curOrigins.push({ ok: g.ok, coord: g.coord });
    g.items.forEach(m => { if (!curDests.has(m.dk)) curDests.set(m.dk, m.destination); });
    curItems.push(...g.items);
  });
  flushBatch();

  let updated = 0;
  let donePairs = 0;
  const totalPairs = missing.length;
  if (onProgress) onProgress(0, totalPairs);

  const CONCURRENCY = 4;
  for (let i = 0; i < batches.length; i += CONCURRENCY) {
    const slice = batches.slice(i, i + CONCURRENCY);
    await Promise.all(slice.map(async batch => {
      const items = batch.items;
      if (!items.length) return;
      const oIdxMap = new Map();
      batch.origins.forEach((o, idx) => oIdxMap.set(o.ok, idx));
      const dCoords = [];
      const dIdxMap = new Map();
      items.forEach(m => {
        if (!dIdxMap.has(m.dk)) {
          dIdxMap.set(m.dk, dCoords.length);
          dCoords.push(m.destination);
        }
      });

      const resolved = new Set();
      try {
        const allPts = batch.origins.map(o => o.coord).concat(dCoords);
        const coordsStr = allPts.map(pt => pt.lon + "," + pt.lat).join(";");
        const srcIdx = batch.origins.map((_, idx) => idx).join(";");
        const dstIdx = dCoords.map((_, idx) => batch.origins.length + idx).join(";");
        const url = "https://router.project-osrm.org/table/v1/driving/" + coordsStr + "?sources=" + srcIdx + "&destinations=" + dstIdx + "&annotations=distance,duration";
        const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
        if (res.ok) {
          const data = await res.json();
          if (data && data.code === "Ok" && data.distances && data.durations) {
            items.forEach(m => {
              const oi = oIdxMap.get(m.ok);
              const di = dIdxMap.get(m.dk);
              const distM = data.distances[oi] && data.distances[oi][di];
              const durS = data.durations[oi] && data.durations[oi][di];
              if (typeof distM === "number" && isFinite(distM) && typeof durS === "number" && isFinite(durS)) {
                const prevCache = S.routes[m.key];
                S.routes[m.key] = {
                  roadKm: distM / 1000,
                  roadMin: durS / 60,
                  distanceMeters: Math.round(distM),
                  durationSeconds: Math.round(durS),
                  polyline: (prevCache && prevCache.polyline) || "",
                  source: (prevCache && prevCache.polyline) ? prevCache.source : "osrm_table",
                  ts: Date.now()
                };
                resolved.add(m.key);
                updated++;
              }
            });
          }
        }
      } catch (e) {}

      const unresolved = items.filter(m => !resolved.has(m.key));
      if (unresolved.length) {
        const SUB_CHUNK = 4;
        for (let k = 0; k < unresolved.length; k += SUB_CHUNK) {
          await Promise.all(unresolved.slice(k, k + SUB_CHUNK).map(async m => {
            try {
              const url = "https://router.project-osrm.org/route/v1/driving/" + m.origin.lon + "," + m.origin.lat + ";" + m.destination.lon + "," + m.destination.lat + "?overview=full&geometries=polyline";
              const r = await fetch(url, { signal: AbortSignal.timeout(5000) });
              if (r.ok) {
                const d = await r.json();
                if (d && d.code === "Ok" && d.routes && d.routes[0]) {
                  const rt = d.routes[0];
                  S.routes[m.key] = {
                    roadKm: rt.distance / 1000,
                    roadMin: rt.duration / 60,
                    distanceMeters: Math.round(rt.distance),
                    durationSeconds: Math.round(rt.duration),
                    polyline: rt.geometry || "",
                    source: "osrm",
                    ts: Date.now()
                  };
                  updated++;
                }
              }
            } catch (err) {}
          }));
        }
      }

      donePairs += items.length;
      if (onProgress) onProgress(donePairs, totalPairs);
    }));
  }

  if (updated > 0) save();
  return updated;
}

function collectPrePlanRoutePairs(date) {
  const jobsD = jobsOn(date);
  if (!jobsD.length) return [];
  const plan = S.plans[date] || null;
  const avail = techAvail(date);
  const units = buildUnits(jobsD);
  const coordUnits = units.filter(u => u.coord && u.slot != null);
  const startLim = Math.max(S.settings.maxStart || 10, S.settings.maxZone || 12, 18);
  const hopLim = S.settings.maxHop || 12;
  const dblLim = S.settings.doubleKm || 5;
  const pairs = [];
  const seen = new Set();
  const addPair = (o, d) => {
    if (!o || !d || o.lat == null || o.lon == null || d.lat == null || d.lon == null) return;
    const k = routeKey(o, d);
    if (!k || seen.has(k)) return;
    const cached = getCachedRoute(o, d);
    if (cached && cached.roadKm != null && cached.source !== "fallback_estimate") return;
    seen.add(k);
    pairs.push({ origin: o, destination: d });
  };

  if (plan && plan.assign) {
    avail.forEach(t => {
      const zRef = zoneRef(t);
      const fixedList = [];
      units.forEach(u => {
        const a = unitAsg(plan, u);
        if (a && a.tech === t.id) fixedList.push({ u, slot: a.slot });
      });
      fixedList.sort((a, b) => (a.u.start - b.u.start) || (a.slot - b.slot));
      if (fixedList.length) {
        if (zRef && fixedList[0].u.coord) addPair(zRef, fixedList[0].u.coord);
        for (let i = 1; i < fixedList.length; i++) {
          if (fixedList[i - 1].u.coord && fixedList[i].u.coord) {
            addPair(fixedList[i - 1].u.coord, fixedList[i].u.coord);
          }
        }
      }
    });
  }

  avail.forEach(t => {
    const zRef = zoneRef(t);
    if (!zRef) return;
    coordUnits.forEach(u => {
      if (u.reasons.length) return;
      if (haversine(zRef, u.coord) <= startLim) addPair(zRef, u.coord);
    });
    if (plan && plan.assign) {
      const fixedList = units.filter(u => { const a = unitAsg(plan, u); return a && a.tech === t.id && u.coord; })
        .sort((a, b) => (a.start - b.start));
      if (fixedList.length && haversine(zRef, fixedList[0].coord) > (S.settings.maxStart || 10)) {
        coordUnits.forEach(u => {
          if (!u.reasons.length && haversine(fixedList[0].coord, u.coord) <= (S.settings.maxZone || 12)) {
            addPair(fixedList[0].coord, u.coord);
          }
        });
      }
    }
  });

  for (let i = 0; i < coordUnits.length; i++) {
    const A = coordUnits[i];
    if (A.reasons.length) continue;
    for (let j = 0; j < coordUnits.length; j++) {
      if (i === j) continue;
      const B = coordUnits[j];
      if (B.reasons.length) continue;
      if (A.slot < B.slot) {
        if (haversine(A.coord, B.coord) <= hopLim) addPair(A.coord, B.coord);
      } else if (A.slot === B.slot && A.start <= B.start) {
        if (haversine(A.coord, B.coord) <= dblLim) addPair(A.coord, B.coord);
      }
    }
  }
  return pairs;
}

function collectAssignedRoutePairs(date) {
  const jobsD = jobsOn(date);
  if (!jobsD.length || !S.plans[date]) return [];
  const a = analyze(date);
  const pairs = [];
  const seen = new Set();
  const addPair = (o, d) => {
    if (!o || !d || o.lat == null || o.lon == null || d.lat == null || d.lon == null) return;
    const k = routeKey(o, d);
    if (!k || seen.has(k)) return;
    const cached = getCachedRoute(o, d);
    if (cached && cached.roadKm != null && cached.source !== "fallback_estimate") return;
    seen.add(k);
    pairs.push({ origin: o, destination: d });
  };
  a.techs.forEach(t => {
    const L = (a.perTech[t.id] && a.perTech[t.id].list) || [];
    if (!L.length) return;
    const zRef = zoneRef(t);
    if (zRef && L[0].u.coord) addPair(zRef, L[0].u.coord);
    for (let i = 1; i < L.length; i++) {
      if (L[i - 1].u.coord && L[i].u.coord) addPair(L[i - 1].u.coord, L[i].u.coord);
    }
  });
  return pairs;
}

async function prepareRealRoutesAndReplan(dates, why, onProgress) {
  const list = (dates || []).filter(d => d && (jobsOn(d).length || S.plans[d]));
  if (!list.length) return;
  if (S.settings.useRealRoutes !== false) {
    const prePairs = [];
    const seen = new Set();
    list.forEach(d => {
      collectPrePlanRoutePairs(d).forEach(p => {
        const k = routeKey(p.origin, p.destination);
        if (k && !seen.has(k)) { seen.add(k); prePairs.push(p); }
      });
    });
    if (prePairs.length) {
      await fetchRealRoadMatrix(prePairs, onProgress);
    }
  }
  list.forEach(d => { if (jobsOn(d).length || S.plans[d]) replan(d, why); });
  if (S.settings.useRealRoutes !== false) {
    const postPairs = [];
    const seenPost = new Set();
    list.forEach(d => {
      collectAssignedRoutePairs(d).forEach(p => {
        const k = routeKey(p.origin, p.destination);
        if (k && !seenPost.has(k)) { seenPost.add(k); postPairs.push(p); }
      });
    });
    if (postPairs.length) {
      await fetchRealRoadMatrix(postPairs);
      list.forEach(d => { if (S.plans[d] && !isFrozen(S.plans[d]) && S.plans[d].status !== 'cancelled') refreshStatus(d); });
    }
  }
  save();
}

function homeRef(t) { if (t.picked) return null; const la = parseCoord(t.homeLat, 'lat'), lo = parseCoord(t.homeLon, 'lon'); return la.st === 'ok' && lo.st === 'ok' ? { lat: la.n, lon: lo.n } : null; }
function zoneRef(t) { const hr = homeRef(t); if (hr) return hr; const z = DISTRICTS[t.zone]; return z ? { lat: z.lat, lon: z.lon } : null; }
function zoneDistInfo(t, u) {
  const ref = zoneRef(t); if (!ref) return null;
  const p = u.coord || (u.district && DISTRICTS[u.district] ? DISTRICTS[u.district] : null); if (!p) return null;
  const hasHome = !!homeRef(t);
  if (u.coord && S.settings.useRealRoutes !== false) {
    const m = getRealRoadMetric(ref, u.coord);
    if (m) return { km: m.km, min: m.min, direct: m.direct, real: m.real, hasHome, ref };
  }
  const d = haversine(ref, p);
  return { km: d, min: travelMin(d), direct: d, real: false, hasHome, ref };
}
function zoneDist(t, u) {
  const zi = zoneDistInfo(t, u);
  return zi ? zi.km : null;
}
function zoneCost(t, u) {
  const d = zoneDist(t, u); if (d == null) return 12;
  let c = Math.min(d, 40); if (u.district && u.district === t.zone) c *= 0.3; return c * 0.8;
}

/* ===== Optimizer ===== */
const UNASSIGNED_PEN = 1000;
let ALLOW_FAR = false;
function klongLimit(t) { const v = t.klongFrom; if (v !== undefined && v !== '') return +v > 0 ? +v : null; return t.id === 't1' ? 5 : null; }
function klongBlocked(t, u) { const lim = klongLimit(t); if (!lim || !KLONG_DISTRICTS.has(u.district)) return false; const k = klongOf(u.jobs[0].address); return k != null && k >= lim; }
function avoidCross(t) { return t.noCross !== undefined ? !!t.noCross : true; }
function crosses(t, u) { if (!avoidCross(t)) return false; const a = riverBank(t.zone), b = riverBank(u.district); return !!(a && b && a !== b); }
function techCost(t, items) { // items: [{u, slot, fixed}]
  if (!items.length) return 0;
  if (t.locked && items.some(i => !i.fixed)) return Infinity; // ช่างที่ล็อกไว้ ไม่รับงานเพิ่มอัตโนมัติ
  if (items.length > S.settings.maxHouses && items.some(i => !i.fixed)) return Infinity;
  const L = items.slice().sort((a, b) => (a.u.start - b.u.start) || (a.slot - b.slot));
  let cost = 0;
  for (const it of L) if (!it.fixed && klongBlocked(t, it.u)) return Infinity;

function filterKey(v) { return String(v || '').toLowerCase().replace(/[\u00a0\u200b\u200c\u200d]/g, ' ').replace(/[–—−]/g, '-').replace(/\s+/g, ' ').trim().replace(/\s*-\s*/g, '-').replace(/\s*\/\s*/g, '/'); }

function rawFilterReason(rec) {
  const title = String(rec.title || '');
  const tk = filterKey(title);
  if (RAW_EXCLUDED_TITLE_KEYS.has(tk)) return 'Title อยู่ในรายการที่ไม่รับจัด';
  if (/support\s*stream|ย้ายแนวสาย|camera/i.test(title)) return 'Title มีคำที่ไม่รับจัด (Support Stream / ย้ายแนวสาย / Camera)';
  const access = String(rec.access || '').replace(/\s/g, '');

  if (/red|osm/i.test(String(rec.contractTeam || ''))) return 'Contract Team มี RED หรือ OSM';
  const status = String(rec.status || '').trim().toLowerCase();

}

function thaiOnly(t) { return String(t || '').replace(/[^\u0E00-\u0E7F\s]/g, ' ').replace(/(นางสาว|น\.ส\.|นาย|นาง|คุณ)/g, ' ').replace(/\s+/g, ' ').trim(); }
function matchTech(name) {
  const v = thaiOnly(name); if (!v) return null; const vn = v.replace(/\s/g, '');
  const hit = S.techs.filter(t => { const tn = thaiOnly(t.name), parts = tn.split(' ').filter(Boolean); if (!parts.length) return false; if (vn.includes(tn.replace(/\s/g, ''))) return true; return parts.length >= 2 && parts.every(x => vn.includes(x)); });

  const placed = {};

    const j = S.jobs[key]; if (!j || j.cancelled) return;
    const eng = job.engineer; if (!eng) { rep.noName++; return; }
    const t = matchTech(eng); if (!t) { rep.noMatch[eng] = (rep.noMatch[eng] || 0) + 1; return; }
    const sl = natSlot(j); if (!j.date || sl == null) { rep.noSlot.push(j.access); return; }

    if (isFrozen(plan)) { rep.frozen++; return; }
    j.lockedTech = t.id; delete plan.removed[key]; delete plan.proposal[key];
    const slotKey = j.date + '|' + t.id + '|' + sl; const bundleKey = (j.address || '') + '|' + (j.timeStr || '');

    if (!already) placed[slotKey] = bundleKey;

      S.changes.push({ ts, up: up.id, type: 'ข้อมูลเปลี่ยน', key, access: job.access, fields: d, impact: 'อาจมีผลต่อช่าง เวลา หรือเส้นทาง' });
      const oldDate = old.date, dOver = old.dOver;
      Object.assign(old, job, { firstSeen: old.firstSeen, dOver: dOver && job.address === old.address ? dOver : null, cancelled: false, changedAt: ts, uploadId: up.id });
      old.lastSeen = ts; old.absent = false;
      if (oldDate && oldDate !== old.date) { const op = S.plans[oldDate]; if (op) { delete op.assign[key]; delete op.removed[key]; } touched.add(oldDate); }
      const np = old.date && S.plans[old.date];
      if (np && isFrozen(np) && np.assign[key]) old.impact = true;
      if (np && !isFrozen(np) && np.assign[key] && (d.some(x => x.f === 'Plan Arrival Time') || d.some(x => x.f === 'Address' || x.f === 'Latitude' || x.f === 'Longitude'))) { /* ระบบจัดใหม่ตามข้อมูลล่าสุดในรอบคำนวณ ยกเว้นงานที่ผู้ใช้จัดเอง */ }
      if (old.date) touched.add(old.date);
    } else { up.unchanged++; old.lastSeen = ts; if (old.absent) { old.absent = false; } old.conflict = job.conflict || false; }
  });
  Object.values(S.jobs).forEach(j => {
    if (up.mode !== 'planned' && !j.lockedTech && !seen.has(j.key) && !j.cancelled && j.date && fileDates.has(j.date)) {
      if (!j.absent) { j.absent = true; up.absent++; S.changes.push({ ts, up: up.id, type: 'ไม่พบในไฟล์ใหม่ (อาจยกเลิก)', key: j.key, access: j.access, fields: [{ f: 'สถานะ', b: 'ใช้งาน', a: 'ไม่พบในไฟล์ ' + p.file }] }); }
      touched.add(j.date);
    }
  });
  if (up.mode === 'planned') { const rep = applyPlanned(up, seen, ts); up.planned = { locked: rep.locked, noName: rep.noName, noMatch: rep.noMatch, noSlot: rep.noSlot.length, frozen: rep.frozen, double: rep.double }; rep.dates.forEach(d => touched.add(d)); }
  S.selectedDate = p.date || S.selectedDate;
  up._touched = [...touched];
  if (!(opts && opts.skipReplan)) {
    touched.forEach(d => { if (jobsOn(d).length || S.plans[d]) replan(d, 'นำเข้าไฟล์ ' + p.file); });
    if (p.date) { const a = analyze(p.date); up.assigned = a.counts.assigned; up.unassigned = a.counts.unassigned; up.review = a.counts.review; up.planStatus = (S.plans[p.date] || {}).status; }
  }
  S.uploads.unshift(up); save();
  return up;
}

  if (!a) return emptyState();
  const realCount = a.pairs.filter(p => p.real).length;
  const totalPairs = a.pairs.length;
  const uncalcCount = totalPairs - realCount;

  let o = '<div class="settings-wrap">';
  o += '<div class="settings-hero">';
  o += '<div><h2>🚗 ระยะทางและเวลาเดินทางระหว่างจุดทำงานของช่าง</h2>';
  o += '<p>ประเมินระยะทางขับขี่ตามแนวถนนจริง (ไม่ใช่เส้นตรง) พร้อมจำลองเวลาเดินทางตามสภาพการจราจรจริง เพื่อช่วยให้จัดช่างและสลับงานได้แม่นยำ ไม่เสี่ยงเดินทางสาย</p></div>';
  o += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
  if (totalPairs > 0) {
    o += '<button class="btn primary" data-act="calcRealRoutes"' + (isCalculatingRoutes ? ' disabled' : '') + '>' + (isCalculatingRoutes ? '⏳ กำลังคำนวณ Google Maps...' : (uncalcCount === 0 ? '✓ คำนวณถนนจริงครบแล้ว (' + realCount + ' ช่วง) · คำนวณใหม่' : '🚗 คำนวณเส้นทางและเวลาจริง (' + uncalcCount + ' ช่วง)')) + '</button>';
  }
  o += '</div></div>';

  if (realCount > 0) {
    o += '<div class="summary" style="margin:0"><div class="stat ok"><span class="n">' + realCount + ' / ' + totalPairs + '</span><span class="l">ช่วงที่ใช้ระยะถนนจริง</span></div><div class="stat info"><span class="n">' + S.settings.workMin + ' นาที</span><span class="l">เวลาทำงานต่อจุด (คงที่)</span></div><div class="stat ' + (a.pairs.some(p => p.ok === false) ? 'risk' : 'ok') + '"><span class="n">' + a.pairs.filter(p => p.ok === false).length + '</span><span class="l">ช่วงที่เสี่ยงเดินทางไม่ทัน</span></div></div>';
  }

  o += '<div class="settings-card">';
  o += a.pairs.length ? '<div class="tscroll"><table class="data"><thead><tr><th>ช่าง</th><th>จากงาน</th><th>ไปงาน</th><th>ระยะทาง</th><th>เวลาขับรถ</th><th>เวลารวมที่ต้องใช้</th><th>เวลาที่มีระหว่างนัด</th><th>การประเมิน</th><th>เส้นทาง Google Maps</th></tr></thead><tbody>' + a.pairs.map(r => {
    const isReal = r.real && r.roadKm != null;
    const distHtml = isReal
      ? '<b>' + r.roadKm.toFixed(1) + ' กม.</b> ' + pill('ok', 'ถนนจริง', '🛣️') + '<br><small class="muted">เส้นตรง: ' + (r.d != null ? r.d.toFixed(1) + ' กม.' : '-') + '</small>'
      : (r.d == null ? 'ไม่มีพิกัด' : '<b>' + r.d.toFixed(1) + ' กม.</b> ' + pill('info', 'เส้นตรง', '📏'));

    const timeHtml = isReal
      ? '<b>~' + Math.round(r.roadMin) + ' นาที</b> ' + pill('ok', 'จราจรจริง', '🚦')
      : (r.d == null ? '-' : r.same ? '-' : '~' + Math.round(r.tm) + ' นาที <small class="muted">(ประมาณ)</small>');

    const needHtml = isReal
      ? '<b>~' + Math.round(r.need) + ' นาที</b><br><small class="muted">ทำ ' + S.settings.workMin + ' + ขับ ~' + Math.round(r.roadMin) + ' น.</small>'
      : (r.d == null ? '-' : '~' + Math.round(r.need) + ' นาที');

    const gapHtml = r.same ? '<span class="pill info">Slot เดียวกัน</span>' : '<b>' + r.gap + ' นาที</b>';

    let resultPill = '';
    if (r.d == null) {
      resultPill = pill('warn', 'ตรวจไม่ได้', '⚠');
    } else if (r.same) {
      const dVal = isReal ? r.roadKm : r.d;
      resultPill = pill(dVal <= S.settings.doubleKm ? 'warn' : 'risk', dVal <= S.settings.doubleKm ? 'Double-Up' : 'ไกลเกิน ' + S.settings.doubleKm + ' กม.', dVal <= S.settings.doubleKm ? '⚠' : '✖');
    } else if (r.ok) {
      resultPill = isReal ? pill('ok', 'ทันตามเวลาจริง', '✓') : pill('info', 'ทันตามประมาณ', '✓');
    } else {
      resultPill = pill('risk', 'เสี่ยงไม่ทัน (' + (isReal ? 'ถนนจริง' : 'ประมาณ') + ')', '✖');
    }

    const pairNavUrl = (r.from.u.coord && r.to.u.coord) ? 'https://www.google.com/maps/dir/?api=1&origin=' + r.from.u.coord.lat + ',' + r.from.u.coord.lon + '&destination=' + r.to.u.coord.lat + ',' + r.to.u.coord.lon + '&travelmode=driving' : null;

    return '<tr>' +
      '<td><b>' + h(r.tech.name) + '</b></td>' +
      '<td>' + h(r.from.u.jobs[0].access) + ' <small>S' + r.from.slot + ' (' + h(r.from.u.jobs[0].timeStr || '') + ')</small><br><small class="muted">' + h(r.from.u.district || '') + '</small></td>' +
      '<td>' + h(r.to.u.jobs[0].access) + ' <small>S' + r.to.slot + ' (' + h(r.to.u.jobs[0].timeStr || '') + ')</small><br><small class="muted">' + h(r.to.u.district || '') + '</small></td>' +
      '<td class="num">' + distHtml + '</td>' +
      '<td class="num">' + timeHtml + '</td>' +
      '<td class="num">' + needHtml + '</td>' +
      '<td class="num">' + gapHtml + '</td>' +
      '<td>' + resultPill + '</td>' +
      '<td>' + (pairNavUrl ? '<a class="btn tiny" href="' + pairNavUrl + '" target="_blank" rel="noopener">เปิดใน Google Maps ↗</a>' : '-') + '</td>' +
      '</tr>';
  }).join('') + '</tbody></table></div>' : '<p class="muted" style="text-align:center;padding:24px 0;margin:0">ยังไม่มีงานต่อเนื่องของช่างคนใดที่ต้องคำนวณระยะ</p>';
  o += '</div></div>';
  return o;
}
function viewHistory() {
  const d = curDate(), p = d && S.plans[d];
  let o = '<section><h2>ประวัติการอัปโหลด</h2>';
  o += S.uploads.length ? '<div class="tscroll"><table class="data"><thead><tr><th>นำเข้าเมื่อ</th><th>ไฟล์</th><th>อ่านได้ (แถว)</th><th>ใบงาน</th><th>งานใหม่</th><th>ไม่เปลี่ยน</th><th>เปลี่ยน</th><th>ไม่พบในไฟล์</th><th>ยกเลิก</th><th>ซ้ำ</th><th>ข้อมูลไม่ครบ</th><th>วันที่แพลน</th><th>จัดแล้ว</th><th>จัดไม่ได้</th><th>รอตรวจ</th><th>สถานะแพลน</th><th></th></tr></thead><tbody>' + S.uploads.map(u => '<tr><td>' + fmtTs(u.ts) + '</td><td>' + h(u.file) + (u.mode === 'planned' ? ' <small>[ไฟล์แพลนเดิม: ล็อก ' + ((u.planned || {}).locked || 0) + ' ใบ]</small>' : '') + '</td><td class="num">' + u.rowsRead + '</td><td class="num">' + u.jobs + '</td><td class="num">' + u.new + '</td><td class="num">' + u.unchanged + '</td><td class="num">' + u.changed + '</td><td class="num">' + u.absent + '</td><td class="num">' + u.cancelled + '</td><td class="num">' + u.dup + '</td><td class="num">' + u.incomplete + '</td><td>' + fmtDateTH(u.planDate) + '</td><td class="num">' + u.assigned + '</td><td class="num">' + u.unassigned + '</td><td class="num">' + u.review + '</td><td>' + h(STATUS_TXT[u.planStatus] || '-') + '</td><td><button class="btn tiny" data-act="histFilter" data-u="' + u.id + '">ดูการเปลี่ยนแปลง</button></td></tr>').join('') + '</tbody></table></div>' : '<p class="muted">ยังไม่มีประวัติการอัปโหลด</p>';
  const ch = S.changes.filter(c => !histFilter || c.up === histFilter);
  o += '</section><section><h2>การเปลี่ยนแปลงระหว่างไฟล์ ' + (histFilter ? '<button class="btn tiny" data-act="histFilter" data-u="">ดูทั้งหมด</button>' : '') + '</h2>';
  o += ch.length ? '<div class="tscroll"><table class="data"><thead><tr><th>เวลา</th><th>ประเภท</th><th>Access Number</th><th>Request No.</th><th>ค่าก่อน → ค่าหลัง</th><th>ผลกระทบ</th></tr></thead><tbody>' + ch.slice(0, 400).map(c => '<tr><td>' + fmtTs(c.ts) + '</td><td>' + pill(c.type === 'งานใหม่' ? 'info' : c.type === 'ข้อมูลเปลี่ยน' ? 'warn' : 'risk', c.type) + '</td><td>' + h(c.access) + '</td><td>' + h(c.key) + '</td><td>' + (c.fields || []).map(f => '<div><b>' + h(f.f) + ':</b> ' + h(f.b) + ' → ' + h(f.a) + '</div>').join('') + '</td><td>' + h(c.impact || '') + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="muted">ยังไม่มีรายการเปลี่ยนแปลง</p>';
  o += '</section><section><h2>บันทึกการจัดแพลนวันที่ ' + fmtDateTH(d) + '</h2>' + (p && p.log.length ? '<ul class="log">' + p.log.slice().reverse().slice(0, 80).map(l => '<li><span class="muted">' + fmtTs(l.ts) + '</span> ' + h(l.text) + '</li>').join('') + '</ul>' : '<p class="muted">ยังไม่มีบันทึก</p>') + '</section>';
  return o;
}

function gmapsLink(pts) {
  const f = p => p.lat + ',' + p.lon;
  if (!pts.length) return null;
  if (pts.length === 1) return 'https://www.google.com/maps/search/?api=1&query=' + f(pts[0]);
  const p = pts.slice(0, 11);
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=' + f(p[0]) + '&destination=' + f(p[p.length - 1]) + (p.length > 2 ? '&waypoints=' + p.slice(1, -1).map(f).join('%7C') : '');
}

let realMapMode = 'real'; // 'real' | 'svg'

let realMapTraffic = false;

let currentLMap = null;

let gmapLoadingPromise = null;

async function ensureGoogleMapsLoaded() {
  if (window.google && window.google.maps) return true;
  if (gmapLoadingPromise) return gmapLoadingPromise;
  gmapLoadingPromise = (async () => {
    try {
      const isStaticHost = window.location.hostname.endsWith("github.io") || window.location.protocol === "file:";
      if (isStaticHost) return false;
      let key = '';
      try {
        const res = await fetch('/api/maps/config');
        if (res.ok) {
          const cfg = await res.json();
          key = cfg.apiKey || '';
        }
      } catch (e) {
        console.warn('Could not fetch /api/maps/config:', e);
      }
      if (!key) return false;
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&v=weekly&loading=async';
        s.async = true;
        s.onload = () => resolve(true);
        s.onerror = err => reject(err);
        document.head.appendChild(s);
      });
      return !!(window.google && window.google.maps);
    } catch (err) {
      console.warn('Google Maps JS API load failed, will use Leaflet fallback:', err);
      return false;
    }
  })();
  return gmapLoadingPromise;
}
