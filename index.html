  const routes = a.techs.map((t, i) => {
    const L = a.perTech[t.id] ? a.perTech[t.id].list : [];
    const colorHex = TECH_PALETTE[i % TECH_PALETTE.length];
    return {
      t, i,
      color: 'var(--s' + (i % SERIES + 1) + ')',
      colorHex,
      pts: L.filter(e => e.u.coord).map(e => ({ e, lat: e.u.coord.lat, lon: e.u.coord.lon })),
      nocoord: L.filter(e => !e.u.coord).length
    };
  });
  const un = a.unassigned.concat(a.review).filter(u => u.coord);
  const all = [];
  routes.forEach(r => r.pts.forEach(p => all.push(p)));
  un.forEach(u => all.push(u.coord));

  routes.forEach(r => {
    for (let k = 1; k < r.pts.length; k++) {
      const cached = getCachedRoute(r.pts[k - 1], r.pts[k]);
      if (cached && cached.polyline) {
        const polyCoords = decodePolyline(cached.polyline);
        polyCoords.forEach(c => all.push(c));
      }
    }
  });

  // Generate SVG Diagram fallback
  let svg = '';
  if (!all.length) svg = '<p class="muted">ยังไม่มีงานที่มีพิกัดให้แสดง</p>';
  else {
    let minLa = Math.min(...all.map(p => p.lat)), maxLa = Math.max(...all.map(p => p.lat)), minLo = Math.min(...all.map(p => p.lon)), maxLo = Math.max(...all.map(p => p.lon));
    if (maxLa - minLa < 0.02) { minLa -= .01; maxLa += .01; } if (maxLo - minLo < 0.02) { minLo -= .01; maxLo += .01; }
    const cl = Math.cos((minLa + maxLa) / 2 * Math.PI / 180);
    const sc = Math.min((W - 2 * M) / ((maxLo - minLo) * cl), (H - 2 * M) / (maxLa - minLa));
    const ox = (W - (maxLo - minLo) * cl * sc) / 2, oy = (H - (maxLa - minLa) * sc) / 2;
    const X = lon => ox + (lon - minLo) * cl * sc, Y = lat => oy + (maxLa - lat) * sc;
    const km5 = 5 / 111.2 * sc;
    svg = '<svg class="rmap" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="แผนผังเส้นทางช่างทั้งหมด"><rect x="0" y="0" width="' + W + '" height="' + H + '" class="mapbg"/>';
    svg += '<g class="mapgrid">' + [0.25, 0.5, 0.75].map(f => '<line x1="' + (W * f) + '" y1="0" x2="' + (W * f) + '" y2="' + H + '"/><line x1="0" y1="' + (H * f) + '" x2="' + W + '" y2="' + (H * f) + '"/>').join('') + '</g>';
    
    routes.forEach(r => {
      if (mapHidden[r.t.id] || r.pts.length < 1) return;
      if (r.pts.length > 1) {
        for (let k = 1; k < r.pts.length; k++) {
          const p1 = r.pts[k - 1], p2 = r.pts[k];
          const cached = getCachedRoute(p1, p2);
          if (cached && cached.polyline) {
            const roadPts = decodePolyline(cached.polyline);
            if (roadPts.length > 1) {
              svg += '<polyline points="' + roadPts.map(p => X(p.lon).toFixed(1) + ',' + Y(p.lat).toFixed(1)).join(' ') + '" fill="none" stroke="' + r.color + '" stroke-width="3.5" stroke-linejoin="round" opacity=".95"/>';
              continue;
            }
          }
          svg += '<polyline points="' + X(p1.lon).toFixed(1) + ',' + Y(p1.lat).toFixed(1) + ' ' + X(p2.lon).toFixed(1) + ',' + Y(p2.lat).toFixed(1) + '" fill="none" stroke="' + r.color + '" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="' + (r.i % 2 ? '8 4' : '0') + '" opacity=".8"/>';
        }
      }
    });

    un.forEach(u => { svg += '<g data-act="job" data-k="' + h(u.jobs[0].key) + '" class="mk"><title>' + h('ยังไม่ได้จัด: ' + u.jobs[0].access + ' ' + (u.district || '') + ' ' + (u.jobs[0].timeStr || '')) + '</title><path d="M' + (X(u.coord.lon) - 6) + ',' + (Y(u.coord.lat) - 6) + 'l12,12m0,-12l-12,12" class="mkx"/></g>'; });
    routes.forEach(r => { if (mapHidden[r.t.id]) return; r.pts.forEach((p, k) => { const x = X(p.lon), y = Y(p.lat); svg += '<g data-act="job" data-k="' + h(p.e.u.jobs[0].key) + '" class="mk"><title>' + h(r.t.name + ' · ' + cellText(p.e).replace(/\n/g, ' | ')) + '</title><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="12" class="mkc" stroke="' + r.color + '"/><text x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="middle" class="mkt">S' + p.e.slot + '</text><text x="' + (x + 13).toFixed(1) + '" y="' + (y - 10).toFixed(1) + '" class="mkn" fill="' + r.color + '">#' + (r.i + 1) + '</text></g>'; }); });
    svg += '<g transform="translate(' + (M - 20) + ',' + (H - 22) + ')"><line x1="0" y1="0" x2="' + km5.toFixed(1) + '" y2="0" class="scale"/><text x="0" y="-5" class="scalet">5 กม. (มาตราส่วน)</text></g><text x="' + (W - 30) + '" y="26" class="scalet" text-anchor="middle">▲ เหนือ</text></svg>';
  }

  let o = '<section><h2>🗺️ แผนที่เส้นทางช่าง (ภาพแผนที่จริง)</h2>';
  o += '<p class="muted" style="margin-top:-6px;margin-bottom:12px">แสดงพิกัดงานจริงและเส้นทางการขับรถจริงบนแผนที่ภูมิศาสตร์ ถนนสายจริง และภาพถ่ายดาวเทียม</p>';
  
  // Toolbar
  o += '<div class="real-map-toolbar">';
  o += '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">';
  o += '<span style="font-weight:600;font-size:13px;color:var(--muted)">โหมดแสดง:</span>';
  o += '<button class="btn small ' + (realMapMode === 'real' ? 'on' : '') + '" data-act="mapSetMode" data-mode="real">🗺️ ภาพแผนที่จริง</button>';
  o += '<button class="btn small ' + (realMapMode === 'svg' ? 'on' : '') + '" data-act="mapSetMode" data-mode="svg">📐 ผังไดอะแกรม (SVG)</button>';
  o += '</div>';

  o += '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap" id="realMapSubControls">';
  o += '<button class="btn small ' + (realMapLayer === 'roadmap' ? 'primary' : '') + '" data-act="mapSetLayer" data-layer="roadmap">🛣️ แผนที่ถนน</button>';
  o += '<button class="btn small ' + (realMapLayer === 'satellite' ? 'primary' : '') + '" data-act="mapSetLayer" data-layer="satellite">🛰️ ภาพดาวเทียม</button>';
  o += '<button class="btn small ' + (realMapTraffic ? 'on' : '') + '" data-act="mapToggleTraffic">🚦 ' + (realMapTraffic ? 'ปิดจราจร' : 'สภาพจราจร') + '</button>';
  o += '<button class="btn small" data-act="mapFitBounds" title="ซูมพอดีทุกจุดงาน">🎯 พอดีทุกจุดงาน</button>';
  o += '<button class="btn primary small" data-act="calcRealRoutes"' + (isCalculatingRoutes ? ' disabled' : '') + '>' + (isCalculatingRoutes ? '⏳ กำลังคำนวณ...' : '🚗 คำนวณเส้นทางจริง') + '</button>';
  o += '</div></div>';

  // Real Map container
  o += '<div id="realMapWrapper" class="real-map-wrapper" style="display:' + (realMapMode === 'real' ? 'block' : 'none') + '">';
  o += '<div id="realGMap" class="real-map-container"></div>';
  o += '<div id="realMapLoading" class="real-map-loading"><span>⏳ กำลังโหลดภาพแผนที่จริง...</span></div>';
  o += '</div>';

  // SVG schematic container
  o += '<div id="svgMapWrapper" style="display:' + (realMapMode === 'svg' ? 'block' : 'none') + ';margin-bottom:16px;">' + svg + '</div>';

  // Technician table
  o += '<div class="tscroll"><table class="data"><thead><tr><th>#</th><th>ช่าง</th><th>แสดง</th><th>จุด</th><th>ลำดับงานและระยะห่างแต่ละช่วง</th><th>ระยะทางรวม</th><th>Google Maps</th></tr></thead><tbody>' + routes.map(r => {
    const off = a.off[r.t.id]; const L = a.perTech[r.t.id].list;
    const seq = L.map((e, i) => {
      let arrow = '';
      if (i === 0) {
        const zi = zoneDistInfo(r.t, e.u);
        if (zi && zi.real) {
          arrow = '<span class="ok" title="จาก' + (zi.hasHome ? 'บ้านช่าง' : 'เขตเริ่มงาน') + '">⌂ ' + (zi.hasHome ? 'บ้านช่าง' : h(r.t.zone || 'เขต')) + ' → ' + zi.km.toFixed(1) + ' กม. (~' + Math.round(zi.min) + ' น.) →</span> ';
        }
      }
      if (i && e.prev) {
        if (e.prev.real && e.prev.roadKm != null) {
          arrow = ' <span class="ok" title="เวลาขับรถจริง ~' + Math.round(e.prev.roadMin) + ' นาที">→ ' + e.prev.roadKm.toFixed(1) + ' กม. (~' + Math.round(e.prev.roadMin) + ' น.) →</span> ';
        } else {
          arrow = ' <span class="muted">→ ' + (e.prev.d == null ? '? กม.' : e.prev.d.toFixed(1) + ' กม.') + ' →</span> ';
        }
      }
      return arrow + '<b>S' + e.slot + '</b> ' + h(e.u.jobs[0].access) + ' <small>' + h(e.u.district || '') + '</small>';
    }).join('');
    const kmInfo = routeKm(a, r.t.id);
    const kmDisplay = kmInfo
      ? (kmInfo.roadKm != null
          ? '<b>' + kmInfo.roadKm.toFixed(1) + ' กม.</b> ' + pill('ok', 'ถนนจริง', '🛣️') + '<br><small class="muted">ขับ ~' + Math.round(kmInfo.roadMin) + ' นาที (เส้นตรง ' + kmInfo.directKm.toFixed(1) + ' กม.)</small>'
          : '<b>' + kmInfo.directKm.toFixed(1) + ' กม.</b> <small class="muted">(เส้นตรง)</small>')
      : '-';
    const link = gmapsLink(r.pts); 
    return '<tr><td><span class="sw" style="background:' + r.color + '"></span> ' + (r.i + 1) + '</td><td>' + h(r.t.name) + '</td><td>' + (off ? pill('off', 'หยุด', '■') : '<label><input type="checkbox" data-chg="maptog" data-t="' + r.t.id + '"' + (mapHidden[r.t.id] ? '' : ' checked') + '> แสดง</label>') + '</td><td class="num">' + L.length + (r.nocoord ? ' <small class="bad">(ไม่มีพิกัด ' + r.nocoord + ')</small>' : '') + '</td><td>' + (seq || '<span class="muted">ไม่มีงาน</span>') + '</td><td class="num">' + kmDisplay + '</td><td>' + (link ? '<a class="btn small" href="' + link + '" target="_blank" rel="noopener">เปิดเส้นทางใน Google Maps ↗</a>' + (r.pts.length > 11 ? '<br><small class="muted">แสดงเฉพาะ 11 จุดแรก</small>' : '') : '-') + '</td></tr>';
  }).join('') + '</tbody></table></div>';
  o += '<p class="muted small">ปุ่ม Google Maps จะเปิดหน้าใหม่ของ Google พร้อมพิกัดลูกค้าของช่างคนนั้นเพื่อนำทางจริง</p>';
  o += '<h3>ดูช่างทุกคนรวมกันใน Google Maps</h3><p class="muted">ส่งออกไฟล์ CSV แล้วนำเข้าที่ <b>Google My Maps</b> (mymaps.google.com) เพื่อดูหมุดทุกงานบนแผนที่จริง</p><p><button class="btn primary" data-act="exportMyMaps">ส่งออก CSV สำหรับ Google My Maps</button></p></section>';
  return o;
}

async function mountGoogleMaps(container, allPoints, routes, unassigned) {
  const ready = await ensureGoogleMapsLoaded();
  if (!ready || !window.google || !window.google.maps) return false;

  if (currentLMap) {
    try { currentLMap.remove(); } catch(e){}
    currentLMap = null;
  }

  let centerLat = 13.7563, centerLon = 100.5018;
  if (allPoints.length) {
    centerLat = allPoints.reduce((s, p) => s + p.lat, 0) / allPoints.length;
    centerLon = allPoints.reduce((s, p) => s + p.lon, 0) / allPoints.length;
  }

  const mapTypeId = realMapLayer === 'satellite' ? google.maps.MapTypeId.HYBRID : google.maps.MapTypeId.ROADMAP;

  if (!currentGMap || !currentGMap.getDiv() || !container.contains(currentGMap.getDiv())) {
    currentGMap = new google.maps.Map(container, {
      center: { lat: centerLat, lng: centerLon },
      zoom: 11,
      mapTypeId: mapTypeId,
      mapTypeControl: true,
      mapTypeControlOptions: {
        position: google.maps.ControlPosition.TOP_RIGHT,
        style: google.maps.MapTypeControlStyle.DROPDOWN_MENU
      },
      streetViewControl: true,
      fullscreenControl: true,
      zoomControl: true,
      internalUsageAttributionIds: [GMP_ATTRIBUTION_ID]
    });
  } else {
    currentGMap.setMapTypeId(mapTypeId);
  }

  if (realMapTraffic) {
    if (!currentGMapTrafficLayer) currentGMapTrafficLayer = new google.maps.TrafficLayer();
    currentGMapTrafficLayer.setMap(currentGMap);
  } else if (currentGMapTrafficLayer) {
    currentGMapTrafficLayer.setMap(null);
  }

  currentGMapPolylines.forEach(p => p.setMap(null));
  currentGMapPolylines = [];
  currentGMapMarkers.forEach(m => m.setMap(null));
  currentGMapMarkers = [];

  const bounds = new google.maps.LatLngBounds();
  let hasBounds = false;
  const infoWindow = new google.maps.InfoWindow();

  routes.forEach(r => {
    if (mapHidden[r.t.id] || r.pts.length < 1) return;

    if (r.pts.length > 1) {
      for (let k = 1; k < r.pts.length; k++) {
        const p1 = r.pts[k - 1], p2 = r.pts[k];
        const cached = getCachedRoute(p1, p2);
        let path = [{ lat: p1.lat, lng: p1.lon }, { lat: p2.lat, lng: p2.lon }];
        let isRealRoad = false;
        if (cached && cached.polyline) {
          const roadPts = decodePolyline(cached.polyline);
          if (roadPts.length > 1) {
            path = roadPts.map(pt => ({ lat: pt.lat, lng: pt.lon }));
            isRealRoad = true;
          }
        }
        path.forEach(pt => { bounds.extend(pt); hasBounds = true; });

        const poly = new google.maps.Polyline({
          path: path,
          geodesic: true,
          strokeColor: r.colorHex || '#2563eb',
          strokeOpacity: isRealRoad ? 0.95 : 0.75,
          strokeWeight: isRealRoad ? 4.5 : 2.5,
          map: currentGMap
        });
        currentGMapPolylines.push(poly);
      }
    }

    r.pts.forEach((p, k) => {
      bounds.extend({ lat: p.lat, lng: p.lon });
      hasBounds = true;

      const pinLabel = 'S' + p.e.slot;
      const marker = new google.maps.Marker({
        position: { lat: p.lat, lng: p.lon },
        map: currentGMap,
        title: r.t.name + ' · Slot ' + p.e.slot + ' (' + p.e.u.jobs[0].access + ')',
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 14,
          fillColor: r.colorHex || '#2563eb',
          fillOpacity: 1,
          strokeColor: '#ffffff',
          strokeWeight: 2.5
        },
        label: {
          text: pinLabel,
          color: '#ffffff',
          fontSize: '11px',
          fontWeight: 'bold'
        }
      });
      currentGMapMarkers.push(marker);

      marker.addListener('click', () => {
        const j = p.e.u.jobs[0];
        const prevInfo = p.e.prev ? (p.e.prev.real && p.e.prev.roadKm != null ? 'ระยะจากจุดก่อน: <b>' + p.e.prev.roadKm.toFixed(1) + ' กม.</b> (~' + Math.round(p.e.prev.roadMin) + ' นาที ทางจริง)' : 'ระยะจากจุดก่อน: ~' + (p.e.prev.d || 0).toFixed(1) + ' กม. (เส้นตรง)') : 'จุดแรกของวัน';
        const content = '<div style="font-family:sans-serif;min-width:220px;padding:4px">' +
          '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">' +
          '<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:' + (r.colorHex || '#2563eb') + '"></span>' +
          '<b>' + h(r.t.name) + ' · Slot ' + p.e.slot + '</b>' +
          '</div>' +
          '<div style="font-size:13px;line-height:1.45;color:#333;margin-bottom:8px">' +
          '<div><b>Access Number:</b> ' + h(j.access) + '</div>' +
          '<div><b>Request No.:</b> ' + h(j.req || '-') + '</div>' +
          '<div><b>เขตลูกค้า:</b> ' + h(effDistrict(j) || 'รอตรวจสอบเขต') + '</div>' +
          '<div><b>เวลานัด:</b> ' + h(j.timeStr || j.planRaw || '-') + '</div>' +
          '<div><b>ที่อยู่:</b> ' + h(j.address || '-') + '</div>' +
          '<div style="color:#0b5f73;font-size:12px;margin-top:4px;background:#eef6f9;padding:4px 6px;border-radius:4px">🚗 ' + prevInfo + '</div>' +
          '</div>' +
          '<div style="border-top:1px solid #eee;padding-top:6px;text-align:right">' +
          '<button class="btn tiny primary" onclick="jobDetail(\'' + h(j.key) + '\');" style="cursor:pointer;padding:4px 8px;border-radius:6px;background:#2563eb;color:#fff;border:none;font-size:12px">ดูรายละเอียดใบงาน ↗</button>' +
          '</div></div>';
        infoWindow.setContent(content);
        infoWindow.open(currentGMap, marker);
      });
    });
  });

  unassigned.forEach(u => {
    if (!u.coord) return;
    bounds.extend({ lat: u.coord.lat, lng: u.coord.lon });
    hasBounds = true;
    const j = u.jobs[0];
    const marker = new google.maps.Marker({
      position: { lat: u.coord.lat, lng: u.coord.lon },
      map: currentGMap,
      title: 'ยังไม่ได้จัด: ' + j.access + ' ' + (u.district || ''),
      icon: {
        path: 'M -6,-6 L 6,6 M 6,-6 L -6,6',
        scale: 2,
        strokeColor: '#dc2626',
        strokeWeight: 3
      }
    });
    currentGMapMarkers.push(marker);

    marker.addListener('click', () => {
      const sl = u.slot || natSlot(j);
      const slotTxt = sl ? ('Slot ' + sl + ' (' + SLOTS[sl - 1].label + ')') : 'นอกช่วง Slot';
      const content = '<div style="font-family:sans-serif;min-width:210px;padding:4px">' +
        '<div style="color:#dc2626;font-weight:bold;margin-bottom:4px">⚠ ใบงานยังไม่ได้จัดลงตาราง</div>' +
        '<div style="font-size:13px;line-height:1.45;color:#333;margin-bottom:8px">' +
        '<div><b>Access Number:</b> ' + h(j.access) + '</div>' +
        '<div><b>Request No.:</b> ' + h(j.req || '-') + '</div>' +
        '<div><b>ช่วงเวลา:</b> <span style="display:inline-block;padding:1px 7px;border-radius:99px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-weight:700;font-size:12px">' + h(slotTxt) + '</span></div>' +
        '<div><b>เวลานัด:</b> ' + h(j.timeStr || j.planRaw || '-') + '</div>' +
        '<div><b>เขต:</b> ' + h(effDistrict(j) || 'รอตรวจสอบเขต') + '</div>' +
        '<div style="font-size:12px;color:#666">' + h(j.address || '') + '</div>' +
        '</div>' +
        '<div style="border-top:1px solid #eee;padding-top:6px;text-align:right">' +
        '<button class="btn tiny primary" onclick="jobDetail(\'' + h(j.key) + '\');" style="cursor:pointer;padding:4px 8px;border-radius:6px;background:#2563eb;color:#fff;border:none;font-size:12px">จัดใบงานนี้ ↗</button>' +
        '</div></div>';
      infoWindow.setContent(content);
      infoWindow.open(currentGMap, marker);
    });
  });

  if (hasBounds) {
    currentGMap.fitBounds(bounds, { top: 40, right: 40, bottom: 40, left: 40 });
  }

  currentRealMapEngine = 'google';
  return true;
}

function mountLeafletMap(container, allPoints, routes, unassigned) {
  if (typeof L === 'undefined') return false;
  if (currentGMap) currentGMap = null;
  if (currentLMap) {
    try { currentLMap.remove(); } catch(e){}
    currentLMap = null;
  }

  let centerLat = 13.7563, centerLon = 100.5018;

    centerLat = allPoints.reduce((s, p) => s + p.lat, 0) / allPoints.length;
    centerLon = allPoints.reduce((s, p) => s + p.lon, 0) / allPoints.length;
  }

  const map = L.map(container).setView([centerLat, centerLon], 11);
  currentLMap = map;

  if (realMapLayer === 'satellite') {
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
      maxZoom: 19

      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);
  }

  const bounds = L.latLngBounds([]);

  routes.forEach(r => {
    if (mapHidden[r.t.id] || r.pts.length < 1) return;

    if (r.pts.length > 1) {
      for (let k = 1; k < r.pts.length; k++) {
        const p1 = r.pts[k - 1], p2 = r.pts[k];
        const cached = getCachedRoute(p1, p2);
        let latlngs = [[p1.lat, p1.lon], [p2.lat, p2.lon]];
        let isRealRoad = false;
        if (cached && cached.polyline) {
          const roadPts = decodePolyline(cached.polyline);
          if (roadPts.length > 1) {

async function mountRealMap(a) {
  if (!a || !a.jobs.length) return;
  const container = document.getElementById('realGMap');
  const loading = document.getElementById('realMapLoading');
  if (!container) return;

  const routes = a.techs.map((t, i) => {
    const L = a.perTech[t.id] ? a.perTech[t.id].list : [];
    const colorHex = TECH_PALETTE[i % TECH_PALETTE.length];
    return {
      t, i,
      color: 'var(--s' + (i % SERIES + 1) + ')',
      colorHex,
      pts: L.filter(e => e.u.coord).map(e => ({ e, lat: e.u.coord.lat, lon: e.u.coord.lon })),
      nocoord: L.filter(e => !e.u.coord).length
    };
  });
  const un = a.unassigned.concat(a.review).filter(u => u.coord);
  const all = [];
  routes.forEach(r => r.pts.forEach(p => all.push(p)));
  un.forEach(u => all.push(u.coord));

  try {
    if (loading) loading.style.display = 'flex';
    let success = await mountGoogleMaps(container, all, routes, un);
    if (!success) {
      mountLeafletMap(container, all, routes, un);
    }
  } catch (err) {
    console.warn('Google Maps mounting error, fallback to Leaflet:', err);
    mountLeafletMap(container, all, routes, un);
  } finally {
    if (loading) loading.style.display = 'none';
  }
}

function fitRealMapBounds(a) {
  if (!a || !a.jobs.length) return;
  const routes = a.techs.map(t => a.perTech[t.id] ? a.perTech[t.id].list : []).flat().filter(e => e.u.coord);
  const un = a.unassigned.concat(a.review).filter(u => u.coord);
  const all = routes.map(e => ({ lat: e.u.coord.lat, lon: e.u.coord.lon })).concat(un.map(u => ({ lat: u.coord.lat, lon: u.coord.lon })));
  if (!all.length) return;

  if (currentRealMapEngine === 'google' && currentGMap && window.google && window.google.maps) {
    const bounds = new google.maps.LatLngBounds();
    all.forEach(p => bounds.extend({ lat: p.lat, lng: p.lon }));
    currentGMap.fitBounds(bounds, { top: 40, right: 40, bottom: 40, left: 40 });
  } else if (currentRealMapEngine === 'leaflet' && currentLMap && typeof L !== 'undefined') {
    const bounds = L.latLngBounds(all.map(p => [p.lat, p.lon]));
    if (bounds.isValid()) currentLMap.fitBounds(bounds, { padding: [40, 40] });
  }
}

function cellPickContinuousMetrics(t, slot, prev, next, u) {
  const legs = [];
  if (!u || !u.coord) return { legs, totalKm: null, totalMin: null, allReal: false };
  if (prev && prev.u.coord) {
    const m = getRealRoadMetric(prev.u.coord, u.coord);
    if (m) legs.push({ label: 'จาก S' + prev.slot, km: m.km, min: m.min, direct: m.direct, real: m.real });
  }
  if (next && next.u.coord) {
    const m = getRealRoadMetric(u.coord, next.u.coord);
    if (m) legs.push({ label: 'ไป S' + next.slot, km: m.km, min: m.min, direct: m.direct, real: m.real });
  }
  if (!legs.length) {
    const ref = zoneRef(t);
    if (ref) {
      const m = getRealRoadMetric(ref, u.coord);
      if (m) legs.push({ label: 'จากเขตเริ่มงาน ' + (t.zone || ''), km: m.km, min: m.min, direct: m.direct, real: m.real, isZone: true });
    }
  }
  if (!legs.length) return { legs, totalKm: null, totalMin: null, allReal: false };
  const totalKm = legs.reduce((s, x) => s + x.km, 0);
  const totalMin = legs.reduce((s, x) => s + x.min, 0);
  const allReal = legs.every(x => x.real);
  return { legs, totalKm, totalMin, allReal };
}

function fmtContinuousLegsHtml(cm, loading) {
  if (!cm || !cm.legs.length) return '<small class="muted">ไม่มีพิกัดสำหรับคำนวณระยะ</small>';
  const parts = cm.legs.map(lg => {
    if (lg.real) return h(lg.label) + ' ถนน <b>' + lg.km.toFixed(1) + ' กม.</b> (~' + Math.round(lg.min) + ' น.)';
    return h(lg.label) + ' ~' + lg.direct.toFixed(1) + ' กม. ' + (loading ? '(รอระยะจริง...)' : '(ประมาณ)');
  });
  const prefix = cm.allReal ? '🛣️ ' : (loading ? '⏳ ' : '');
  const totalTxt = (cm.legs.length > 1 && cm.allReal) ? ' · รวม <b>' + cm.totalKm.toFixed(1) + ' กม.</b> (~' + Math.round(cm.totalMin) + ' น.)' : '';
  return '<small style="color:' + (cm.allReal ? '#0f766e' : 'var(--muted)') + '">' + prefix + parts.join(' → ') + totalTxt + '</small>';
}

function cellPickList(q) {
  const { tech, slot, a, L, loading } = cpCtx; const t = a.techById[tech]; q = String(q || '').trim().toLowerCase();

async function loadCellPickRealRoutes(ctx) {
  const { tech, slot, a, L, token } = ctx;
  const t = a.techById[tech];
  const list = a.perTech[tech].list;
  const prev = list.filter(e => e.slot < slot).pop();
  const next = list.find(e => e.slot > slot);
  const zRef = (!prev && !next) ? zoneRef(t) : null;
  const pairs = [];
  let withCoord = 0;
  L.forEach(u => {
    if (!u || !u.coord) return;
    withCoord++;
    if (prev && prev.u.coord) pairs.push({ origin: prev.u.coord, destination: u.coord });
    if (next && next.u.coord) pairs.push({ origin: u.coord, destination: next.u.coord });
    if (!prev && !next && zRef) pairs.push({ origin: zRef, destination: u.coord });
  });
  try {
    if (pairs.length) await fetchRealRoadMatrix(pairs);
  } catch (e) {}
  if ($('modal').hidden || !cpCtx || cpCtx.token !== token) return;
  cpCtx.loading = false;
  const allReal = L.filter(u => u && u.coord).every(u => cellPickContinuousMetrics(t, slot, prev, next, u).allReal);
  const stEl = $('cpStatus');
  if (stEl) {
    stEl.innerHTML = withCoord === 0
      ? '<span class="pill off">งานที่ค้างยังไม่มีพิกัดสำหรับการคำนวณระยะทางจริง</span>'
      : allReal
        ? '<span class="pill ok">✓ คำนวณระยะทางจริงตามถนนจากงานต่อเนื่องในแพลนแล้ว (' + withCoord + ' งาน)</span>'
        : '<span class="pill warn">คำนวณระยะทางจริงเสร็จสิ้น (บางงานใช้ระยะประมาณเนื่องจากบริการเส้นทางไม่ตอบสนอง)</span>';
  }
  const listEl = $('cpList');
  if (listEl) listEl.innerHTML = cellPickList(($('cpq') && $('cpq').value) || '');
}

function hlText(t) {

function renderDblSuggestList(ctx) {
  const { techId, slot, a, refs, cands, dk, loading } = ctx;
  if (!refs.length) return '<p class="muted">งานใน Slot นี้ยังไม่มีพิกัด จึงไม่สามารถคำนวณระยะทางแนะนำงานเบิ้ลได้</p>';
  if (!cands.length) return '<p class="muted">ไม่พบงานที่ยังไม่จัดใน Slot ' + slot + ' ที่ห่างไม่เกิน ' + dk + ' กม. จากงานในช่องนี้</p>';
  const t = a.techById[techId];
  const list = a.perTech[techId].list;
  const prev = list.filter(e => e.slot < slot).pop();
  const next = list.find(e => e.slot > slot);
  const rows = cands.map(u => {
    let bestSame = null;
    refs.forEach(e => {
      const forward = u.start < e.u.start;
      const m = forward ? getRealRoadMetric(u.coord, e.u.coord) : getRealRoadMetric(e.u.coord, u.coord);
      if (m && (!bestSame || m.km < bestSame.km)) bestSame = m;
    });
    const cm = cellPickContinuousMetrics(t, slot, prev, next, u);
    const sameKm = bestSame ? bestSame.km : Infinity;
    const withinReal = bestSame ? bestSame.km <= dk : false;
    return { u, bestSame, cm, sameKm, withinReal };
  }).sort((x, y) => (y.withinReal - x.withinReal) || (x.sameKm - y.sameKm) || ((x.cm.totalKm == null) - (y.cm.totalKm == null)) || (x.cm.totalKm - y.cm.totalKm));

  return rows.map(r => {
    const s = r.bestSame;
    const sameTxt = s
      ? (s.real
        ? '<small style="color:#0f766e">🛣️ Slot เดียวกัน ถนน <b>' + s.km.toFixed(1) + ' กม.</b> (~' + Math.round(s.min) + ' น.)</small>'
        : '<small class="muted">' + (loading ? '⏳ ' : '') + 'Slot เดียวกัน ~' + s.direct.toFixed(1) + ' กม. ' + (loading ? '(รอระยะจริง...)' : '(ประมาณ)') + '</small>')
      : '';
    const overWarn = (s && s.real && s.km > dk) ? ' <span class="pill warn">ถนนเกินเกณฑ์ ' + dk + ' กม.</span>' : '';
    const contTxt = r.cm && r.cm.legs.length ? ' <span class="muted">·</span> ' + fmtContinuousLegsHtml(r.cm, loading) : '';
    return '<div class="pickrow"><code>' + h(r.u.jobs.map(j => j.access + ' ' + (j.timeStr || '')).join(' | ')) + '</code> <b>' + h(r.u.district || 'รอตรวจสอบเขต') + '</b> ' + sameTxt + overWarn + contTxt + ' ' + (r.u.removedByUser ? '<small>⊘ เคยนำออก</small> ' : '') + '<button class="btn small primary" data-act="acceptDouble" data-k="' + h(r.u.jobs[0].key) + '" data-t="' + h(techId) + '" data-s="' + slot + '">เลือกเบิ้ล</button></div>';
  }).join('');
}

async function loadDblSuggestRealRoutes(ctx) {
  const { techId, slot, a, refs, cands, token } = ctx;
  if (!refs.length || !cands.length) return;
  const t = a.techById[techId];
  const list = a.perTech[techId].list;
  const prev = list.filter(e => e.slot < slot).pop();
  const next = list.find(e => e.slot > slot);
  const zRef = (!prev && !next) ? zoneRef(t) : null;
  const pairs = [];
  cands.forEach(u => {
    if (!u || !u.coord) return;
    refs.forEach(e => {
      if (u.start < e.u.start) pairs.push({ origin: u.coord, destination: e.u.coord });
      else pairs.push({ origin: e.u.coord, destination: u.coord });
    });
    if (prev && prev.u.coord) pairs.push({ origin: prev.u.coord, destination: u.coord });
    if (next && next.u.coord) pairs.push({ origin: u.coord, destination: next.u.coord });
    if (!prev && !next && zRef) pairs.push({ origin: zRef, destination: u.coord });
  });
  try {
    if (pairs.length) await fetchRealRoadMatrix(pairs);
  } catch (e) {}
  if ($('modal').hidden || !dblCtx || dblCtx.token !== token) return;
  dblCtx.loading = false;
  const stEl = $('dblStatus');
  if (stEl) {
    const allReal = cands.every(u => refs.every(e => {
      const m = u.start < e.u.start ? getRealRoadMetric(u.coord, e.u.coord) : getRealRoadMetric(e.u.coord, u.coord);
      return m && m.real;
    }));
    stEl.innerHTML = allReal
      ? '<span class="pill ok">✓ คำนวณระยะทางจริงตามแนวถนนและงานต่อเนื่องในแพลนแล้ว (' + cands.length + ' งาน)</span>'
      : '<span class="pill warn">คำนวณระยะทางจริงเสร็จสิ้น (บางช่วงใช้ระยะประมาณเนื่องจากบริการเส้นทางไม่ตอบสนอง)</span>';
  }
  const listEl = $('dblList');
  if (listEl) listEl.innerHTML = renderDblSuggestList(dblCtx);
}

function computePending() {
  const P = pending;

  if (P.mode !== 'planned' && P.map.status == null) P.err.push('ไฟล์ดิบใหม่ต้องมีคอลัมน์ Task Status เพื่อกรองเฉพาะ New และ Scheduled');
  if (P.mode !== 'planned' && P.map.contractTeam == null) P.err.push('ไฟล์ดิบใหม่ต้องมีคอลัมน์ Contract Team เพื่อกรอง RED และ OSM');
  if (P.map.lat == null || P.map.lon == null) P.warn = ['ไม่พบคอลัมน์ Latitude/Longitude: ทุกใบงานจะไม่มีพิกัดและไม่สามารถคำนวณระยะทางได้'];

  P.allRecs = P.err.length ? [] : rowsToRecords(P.headers, P.rows, P.map, P.hr + 2);
  // ไฟล์แพลนเดิม: ไม่สน Task Status และ Processing Status ทุกกรณี และรับเฉพาะแถวที่มีชื่อ Field Engineer
  // ไฟล์ดิบใหม่ยังใช้ชุดเงื่อนไขกรองเดิมทั้งหมด
  const previewFilter = P.mode === 'planned'

    : filterRawRecords(P.allRecs);

  P.plannedNoEngineer = P.mode === 'planned' ? previewFilter.rejected.length : 0;
  P.jobs = P.recs.map(r => makeJob(r, P.file));
  if (!P.err.length && !P.jobs.length) P.err.push('ไม่พบแถวข้อมูลในไฟล์');
  const dc = {}; P.jobs.forEach(j => { if (j.date) dc[j.date] = (dc[j.date] || 0) + 1; });
  P.dates = Object.keys(dc).sort().map(d => ({ d, n: dc[d] }));
  if (!P.date || !dc[P.date]) P.date = dc[S.selectedDate] ? S.selectedDate : (P.dates.slice().sort((a, b) => b.n - a.n)[0] || {}).d || null;
  const keys = {}; let dupN = 0; P.jobs.forEach(j => { if (keys[j.key]) dupN++; keys[j.key] = 1; });
  P.stat = { rows: P.jobs.length, noReq: P.jobs.filter(j => j.noReq).length, badTime: P.jobs.filter(j => j.timeErr).length, outTime: P.jobs.filter(j => !j.timeErr && natSlot(j) == null).length, noDist: P.jobs.filter(j => !effDistrict(j)).length, noCoord: P.jobs.filter(j => j.coordSt !== 'ok').length, dup: dupN, fttb: P.jobs.filter(j => isFTTB(j.title)).length, excl: P.jobs.filter(isExcluded).length, isNew: P.jobs.filter(j => !S.jobs[j.key]).length, same: 0, changed: 0 };
  P.jobs.forEach(j => { const o = S.jobs[j.key]; if (o) { if (diffJobs(o, j).length) P.stat.changed++; else P.stat.same++; } });
  P.pl = null; if (P.mode === 'planned' && !P.err.length) { const m = {}, nm = {}; let blank = 0, noSlot = 0; P.jobs.forEach(j => { if (!j.engineer) { blank++; return; } const t = matchTech(j.engineer); if (!t) { nm[j.engineer] = (nm[j.engineer] || 0) + 1; return; } if (natSlot(j) == null) { noSlot++; return; } m[t.name] = (m[t.name] || 0) + 1; }); P.pl = { m, nm, blank, noSlot, total: Object.values(m).reduce((a, b) => a + b, 0) }; }
}

/* ===== Automatic Background Google Sheet Sync for Settings & Master Data (Add / Edit / Delete) ===== */
const SETTINGS_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzSbsrT4sZ_MmA3rWyvNek_uAqsu0PWTJSz2nWX5wlTq7i88JgBX_90n6DvETS3n2TPbw/exec";

function getSettingsSheetExecUrl() {
  return SETTINGS_SHEET_WEB_APP_URL;
}

function buildSettingsSyncPayload(action, changeAction, changeDetail) {
  return {
    action: action || "syncAll",
    changeAction: changeAction || "บันทึกการตั้งค่า",
    changeDetail: changeDetail || "",
    techs: S.techs || [],
    dayOff: S.dayOff || {},
    aliases: S.aliases || [],
    settings: S.settings || {}
  };
}

let settingsSyncTimer = null;
let settingsSyncInFlight = false;
let settingsSyncQueued = null;

function scheduleSettingsSheetSync(changeAction, changeDetail) {
  if (!SETTINGS_SHEET_WEB_APP_URL || !S) return;
  clearTimeout(settingsSyncTimer);
  settingsSyncQueued = {
    action: changeAction || "แก้ไขการตั้งค่า",
    detail: changeDetail || ""
  };
  settingsSyncTimer = setTimeout(() => {
    settingsSyncTimer = null;
    flushSettingsSyncQueue();
  }, 50);
}

async function flushSettingsSyncQueue() {
  if (!settingsSyncQueued) return;
  if (settingsSyncInFlight) return;
  const item = settingsSyncQueued;
  settingsSyncQueued = null;
  settingsSyncInFlight = true;
  try {
    await syncSettingsToGoogleSheet(item.action, item.detail);
  } finally {
    settingsSyncInFlight = false;
    if (settingsSyncQueued) {
      flushSettingsSyncQueue();
    }
  }
}

async function postToSettingsSheet(payload) {
  const bodyStr = JSON.stringify(payload);
  try {
    const res = await fetch(SETTINGS_SHEET_WEB_APP_URL, {
      method: "POST",
      redirect: "follow",
      keepalive: true,
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: bodyStr
    });
    const txt = await res.text();
    if (txt && txt.trim().startsWith("<")) {
      throw new Error("Apps Script returned HTML");
    }
    if (txt) {
      const parsed = JSON.parse(txt);
      if (parsed && parsed.status === "error") throw new Error(parsed.message || "Apps Script error");
      return parsed;
    }
    return { status: "success" };
  } catch (err) {
    await fetch(SETTINGS_SHEET_WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      keepalive: true,
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: bodyStr
    });
    return { status: "success", opaque: true };
  }
}

async function getFromSettingsSheet(actionName) {
  const sep = SETTINGS_SHEET_WEB_APP_URL.includes("?") ? "&" : "?";
  const res = await fetch(SETTINGS_SHEET_WEB_APP_URL + sep + "action=" + encodeURIComponent(actionName) + "&_t=" + Date.now(), {
    method: "GET",
    redirect: "follow"
  });
  const txt = await res.text();
  if (!txt || txt.trim().startsWith("<")) {
    throw new Error("Apps Script returned non-JSON response");
  }
  const data = JSON.parse(txt);
  if (data && data.status === "error") throw new Error(data.message || "Apps Script error");
  return data;
}

async function syncSettingsToGoogleSheet(changeAction, changeDetail) {
  try {
    const payload = buildSettingsSyncPayload("syncAll", changeAction, changeDetail);
    await postToSettingsSheet(payload);
    return true;
  } catch (err) {
    return false;
  }
}

function applySettingsDataFromSheet(data) {
  if (!data) return;
  if (Array.isArray(data.techs) && data.techs.length > 0) {
    S.techs = data.techs;
  }
  if (data.dayOff && typeof data.dayOff === "object") {
    S.dayOff = data.dayOff;
  }
  if (Array.isArray(data.aliases)) {
    S.aliases = data.aliases;
  }
  if (data.settings && typeof data.settings === "object") {
    S.settings = Object.assign({}, DEFAULT_SETTINGS, S.settings, data.settings);
    S.settings._userEditedFilters = true;
  }
  S.crossAll = true;

  const validTechIds = new Set((S.techs || []).map(t => t.id));
  Object.keys(S.plans || {}).forEach(d => {
    const pl = S.plans[d];
    if (!pl || isFrozen(pl)) return;
    if (pl.assign) {
      Object.keys(pl.assign).forEach(k => {
        if (!validTechIds.has(pl.assign[k].tech)) delete pl.assign[k];
      });
    }
    if (pl.lockedTech) {
      Object.keys(pl.lockedTech).forEach(tid => {
        if (!validTechIds.has(tid)) delete pl.lockedTech[tid];
      });
    }
    if (pl.startPick) {
      Object.keys(pl.startPick).forEach(tid => {
        if (!validTechIds.has(tid)) delete pl.startPick[tid];
      });
    }
  });

  if (Object.keys(S.jobs || {}).length > 0) {
    reparseAll();
  }
  save();
}

async function pullSettingsFromGoogleSheet(opts) {
  opts = opts || {};
  try {
    const res = await getFromSettingsSheet("getAll");
    if (res && res.initialized === false) {
      if (opts.autoInitPush) {
        return await syncSettingsToGoogleSheet("ซิงก์ข้อมูลตั้งค่าเริ่มต้นครั้งแรก", "อัปโหลดข้อมูลตั้งค่าเริ่มต้นเข้า Google Sheet อัตโนมัติ");
      }
      return false;
    }
    if (res && res.data) {
      applySettingsDataFromSheet(res.data);
      render();
      return true;
    }
    return false;
  } catch (err) {
    return false;
  }
}

function flushPendingSettingsSyncOnExit() {
  if (!settingsSyncTimer && !settingsSyncQueued) return;
  try {
    clearTimeout(settingsSyncTimer);
    settingsSyncTimer = null;
    const item = settingsSyncQueued || { action: "แก้ไขการตั้งค่า", detail: "ซิงก์ก่อนปิดหน้าเว็บ" };
    settingsSyncQueued = null;
    const bodyStr = JSON.stringify(buildSettingsSyncPayload("syncAll", item.action, item.detail));
    fetch(SETTINGS_SHEET_WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      keepalive: true,
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: bodyStr
    }).catch(() => {});
  } catch (e) {}
}
window.addEventListener("beforeunload", flushPendingSettingsSyncOnExit);
window.addEventListener("pagehide", flushPendingSettingsSyncOnExit);

/* ===== Automatic Background Access Logger (Google Sheets) ===== */
const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzqYiuO-dNuKPiMLBDGNO2ZZQYOH8bqjs19n_ON_7OH1NQmxQqXGdYBm2K_gSvVWR9f4w/exec";

function getClientEnvironment() {
  const ua = (typeof navigator !== "undefined" && navigator.userAgent) || "";
  let os = "Windows";
  if (/Android/i.test(ua)) os = "Android";
  else if (/iPhone|iPad|iPod/i.test(ua)) os = "iOS";
  else if (/Macintosh|Mac OS/i.test(ua)) os = "macOS";
  else if (/Linux/i.test(ua)) os = "Linux";
  else if (/Windows/i.test(ua)) os = "Windows";

  let browser = "Chrome";
  if (/Edg\//i.test(ua)) browser = "Edge";
  else if (/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) browser = "Chrome";
  else if (/Safari\//i.test(ua) && !/Chrome\//i.test(ua)) browser = "Safari";
  else if (/Firefox\//i.test(ua)) browser = "Firefox";

  const isMobile = /Mobi|Android|iPhone/i.test(ua);
  return { os: os + (isMobile ? " (Mobile)" : ""), browser: browser };
}

function autoLogVisitToGoogleSheet(sessionId, deviceId) {
  try {
    const env = getClientEnvironment();
    const payload = {
      sessionId: sessionId || "-",
      deviceId: deviceId || "-",
      os: env.os,
      browser: env.browser,
      action: "เข้าใช้งานหน้าเว็บ (Visit)",
      url: window.location.href,
      note: "เปิดใช้งานเว็บ (บันทึกอัตโนมัติ)",
      onlineCount: window._currentOnlineUsers || 1
    };

    fetch(GOOGLE_SHEET_WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).catch(function() {
      try {
        const getUrl = GOOGLE_SHEET_WEB_APP_URL + "?action=" + encodeURIComponent(payload.action) +
          "&sessionId=" + encodeURIComponent(payload.sessionId) +
          "&deviceId=" + encodeURIComponent(payload.deviceId) +
          "&os=" + encodeURIComponent(payload.os) +
          "&browser=" + encodeURIComponent(payload.browser) +
          "&url=" + encodeURIComponent(payload.url);
        const img = new Image();
        img.src = getUrl;
      } catch(e){}
    });
  } catch(err){}
}

function initPresenceTracker() {
  // Generate a distinct session ID for every individual open tab/window
  const tabSessionId = "u_" + Math.random().toString(36).substring(2, 9) + "_" + Date.now().toString(36);
  let deviceId = "";
  try {
    deviceId = localStorage.getItem("applet_device_id") || "";
    if (!deviceId) {
      deviceId = "dev_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("applet_device_id", deviceId);
    }
  } catch(e) {
    deviceId = tabSessionId;
  }
  try { autoLogVisitToGoogleSheet(tabSessionId, deviceId); } catch(e){}

  // Active sessions map: sessionId -> lastSeenTimestamp
  const activeSessions = new Map();
  activeSessions.set(tabSessionId, Date.now());
  let serverReportedCount = 1;

  function recalculateCount() {
    const now = Date.now();
    activeSessions.set(tabSessionId, now);
    for (const [id, ts] of activeSessions.entries()) {
      if (now - ts > 12000) {
        activeSessions.delete(id);
      }
    }
    const finalCount = Math.max(1, activeSessions.size, serverReportedCount);
    window._currentOnlineUsers = finalCount;
    const el = document.getElementById("onlineUserCount");
    if (el && el.textContent !== String(finalCount)) {
      el.textContent = finalCount;
    }
    const badge = document.getElementById("onlineBadge");
    if (badge) {
      badge.title = "มีผู้ใช้งานออนไลน์อยู่ในระบบขณะนี้ " + finalCount + " คน";
    }
  }

  // ===== Layer 1: Local Cross-Tab Sync (BroadcastChannel) =====
  let bc = null;
  try {
    if ("BroadcastChannel" in window) {
      bc = new BroadcastChannel("planafp_presence_channel_v1");
      bc.onmessage = function(e) {
        const d = e.data;
        if (!d || !d.id || d.id === tabSessionId) return;
        if (d.type === "leave") {
          activeSessions.delete(d.id);
        } else {
          activeSessions.set(d.id, Date.now());
        }
        recalculateCount();
      };
    }
  } catch(e){}

  function broadcastLocal(type) {
    if (bc) {
      try {
        bc.postMessage({ id: tabSessionId, dev: deviceId, type: type, ts: Date.now() });
      } catch(e){}
    }
  }

  // ===== Layer 2: Global Real-Time MQTT over WebSocket (Works across devices on GitHub Pages) =====
  const MQTT_TOPIC = "planafp/presence/live_hub_v1";
  let mqttClient = null;
  let mqttConnected = false;
  const BROKER_SERVERS = [
    { host: "broker.emqx.io", port: 8084, path: "/mqtt" },
    { host: "broker.hivemq.com", port: 8884, path: "/mqtt" }
  ];
  let currentBrokerIndex = 0;

  function initMqtt() {
    if (typeof Paho === "undefined" || !Paho.Client) {
      if (!window.__pahoLoading) {
        window.__pahoLoading = true;
        try {
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js";
          s.onload = function() { setTimeout(initMqtt, 100); };
          document.head.appendChild(s);
        } catch(e){}
      }
      setTimeout(initMqtt, 1000);
      return;
    }
    const broker = BROKER_SERVERS[currentBrokerIndex % BROKER_SERVERS.length];
    try {
      mqttClient = new Paho.Client(broker.host, broker.port, broker.path, "afp_" + tabSessionId);
      mqttClient.onConnectionLost = function(resp) {
        mqttConnected = false;
        currentBrokerIndex++;
        setTimeout(initMqtt, 3000);
      };
      mqttClient.onMessageArrived = function(msg) {
        try {
          const data = JSON.parse(msg.payloadString);
          if (data && data.id && data.id !== tabSessionId) {
            if (data.type === "leave") {
              activeSessions.delete(data.id);
            } else {
              activeSessions.set(data.id, Date.now());
            }
            recalculateCount();
          }
        } catch(e){}
      };

      const willMsg = new Paho.Message(JSON.stringify({ id: tabSessionId, type: "leave" }));
      willMsg.destinationName = MQTT_TOPIC;
      willMsg.qos = 0;

      mqttClient.connect({
        useSSL: true,
        timeout: 5,
        keepAliveInterval: 20,
        cleanSession: true,
        willMessage: willMsg,
        onSuccess: function() {
          mqttConnected = true;
          try {
            mqttClient.subscribe(MQTT_TOPIC);
            publishMqtt("ping");
          } catch(e){}
        },
        onFailure: function() {
          mqttConnected = false;
          currentBrokerIndex++;
          setTimeout(initMqtt, 3500);
        }
      });
    } catch(err) {
      currentBrokerIndex++;
      setTimeout(initMqtt, 4000);
    }
  }

  function publishMqtt(type) {
    if (mqttClient && mqttConnected) {
      try {
        const payload = JSON.stringify({ id: tabSessionId, dev: deviceId, type: type, ts: Date.now() });
        const m = new Paho.Message(payload);
        m.destinationName = MQTT_TOPIC;
        m.qos = 0;
        mqttClient.send(m);
      } catch(e){}
    }
  }

  // ===== Layer 3: Backend Heartbeat (Local dev / Cloud Run) =====
  function pingBackend() {
    if (window.location.hostname.endsWith("github.io") || window.location.protocol === "file:") return;
    fetch("/api/presence/heartbeat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId: tabSessionId, deviceId: deviceId })
    })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (d && typeof d.count === "number") {
        serverReportedCount = d.count;
        recalculateCount();
      }
    })
    .catch(() => {});
  }

  // Pulse & Heartbeat cycle
  function pulse() {
    broadcastLocal("ping");
    publishMqtt("ping");
    pingBackend();
    recalculateCount();
  }

  // Start connections
  initMqtt();
  pulse();
  setInterval(pulse, 3500);

  // Send leave notifications on tab / browser close
  function handleLeave() {
    try {
      broadcastLocal("leave");
      publishMqtt("leave");
      if (!window.location.hostname.endsWith("github.io") && window.location.protocol !== "file:" && navigator.sendBeacon) {
        navigator.sendBeacon("/api/presence/leave", JSON.stringify({ sessionId: tabSessionId }));
      }
    } catch(e){}
  }

  window.addEventListener("beforeunload", handleLeave);
  window.addEventListener("pagehide", handleLeave);

  // Re-sync immediately when tab is switched back to
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      pulse();
    }
  });
}
